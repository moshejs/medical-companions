<script type="application/ld+json">{"@context":"https://schema.org","@type":"MedicalWebPage","name":"AUD Companion","headline":"Alcohol use disorder and alcohol withdrawal, explained with animations","url":"%SITE%/alcohol-use-disorder/","isPartOf":{"@type":"WebSite","name":"Medical Companions","url":"%SITE%/"},"inLanguage":"en","description":"Alcohol use disorder explained with animations you can scrub: standard drinks and blood alcohol, how alcohol changes the brain, AUDIT screening and the DSM-5-TR criteria, the withdrawal timeline and CIWA-Ar, managing withdrawal safely, thiamine and Wernicke encephalopathy, naltrexone, acamprosate and disulfiram, talking therapies and mutual help, recovery, the liver and the whole body, pregnancy, families and nursing care. Cited throughout. Educational only, not medical advice.","isAccessibleForFree":true,"audience":[{"@type":"MedicalAudience","audienceType":"Students, patients and caregivers"}],"about":{"@type":"MedicalCondition","name":"Alcohol use disorder","alternateName":["AUD","Alcoholism","Alcohol dependence","Alcohol abuse (DSM-IV)","Alcohol withdrawal syndrome","Wernicke encephalopathy","הפרעת שימוש באלכוהול"],"code":[{"@type":"MedicalCode","code":"F10","codingSystem":"ICD-10"},{"@type":"MedicalCode","code":"F10.10","codingSystem":"ICD-10-CM"},{"@type":"MedicalCode","code":"F10.20","codingSystem":"ICD-10-CM"},{"@type":"MedicalCode","code":"F10.230","codingSystem":"ICD-10-CM"},{"@type":"MedicalCode","code":"6C40.1","codingSystem":"ICD-11"},{"@type":"MedicalCode","code":"6C40.2","codingSystem":"ICD-11"},{"@type":"MedicalCode","code":"6C40.4","codingSystem":"ICD-11"}],"relevantSpecialty":[{"@type":"MedicalSpecialty","name":"Psychiatric"},{"@type":"MedicalSpecialty","name":"Gastroenterologic"}],"possibleTreatment":[{"@type":"Drug","name":"Naltrexone"},{"@type":"Drug","name":"Acamprosate"},{"@type":"Drug","name":"Disulfiram"},{"@type":"Drug","name":"Topiramate"},{"@type":"Drug","name":"Gabapentin"},{"@type":"Drug","name":"Chlordiazepoxide"},{"@type":"Drug","name":"Phenobarbital"},{"@type":"Drug","name":"Thiamine"},{"@type":"PsychologicalTreatment","name":"Brief intervention"},{"@type":"PsychologicalTreatment","name":"Motivational interviewing"},{"@type":"PsychologicalTreatment","name":"Cognitive behavioural therapy"},{"@type":"PsychologicalTreatment","name":"Contingency management"},{"@type":"PsychologicalTreatment","name":"Twelve-step facilitation"},{"@type":"PsychologicalTreatment","name":"Community reinforcement and family training (CRAFT)"}]},"mainContentOfPage":{"@type":"WebPageElement","cssSelector":"main"},"significantLink":["%SITE%/alcohol-use-disorder/what/","%SITE%/alcohol-use-disorder/drinks/","%SITE%/alcohol-use-disorder/brain/","%SITE%/alcohol-use-disorder/genes/","%SITE%/alcohol-use-disorder/screening/","%SITE%/alcohol-use-disorder/criteria/","%SITE%/alcohol-use-disorder/biomarkers/","%SITE%/alcohol-use-disorder/withdrawal/","%SITE%/alcohol-use-disorder/ciwa/","%SITE%/alcohol-use-disorder/detox/","%SITE%/alcohol-use-disorder/wernicke/","%SITE%/alcohol-use-disorder/medicines/","%SITE%/alcohol-use-disorder/offlabel/","%SITE%/alcohol-use-disorder/therapy/","%SITE%/alcohol-use-disorder/recovery/","%SITE%/alcohol-use-disorder/liver/","%SITE%/alcohol-use-disorder/body/","%SITE%/alcohol-use-disorder/families/","%SITE%/alcohol-use-disorder/pregnancy/","%SITE%/alcohol-use-disorder/nursing/","%SITE%/alcohol-use-disorder/frontier/","%SITE%/alcohol-use-disorder/history/","%SITE%/alcohol-use-disorder/sources/"],"disclaimer":"Educational synthesis of published literature. Not medical advice, and not a substitute for a clinician. Doses, benzodiazepine and thiamine regimens and CIWA-Ar thresholds are quoted as published in labels and guidelines, never as instructions; the screening tools and calculators are teaching aids, not self-tests. Stopping suddenly after long, heavy daily drinking can be dangerous: get medical help to stop safely. If you or someone else may have alcohol poisoning or severe withdrawal (seizure, confusion, hallucinations), call emergency services. For help with drinking in the US, SAMHSA's National Helpline is free and confidential: 1-800-662-4357. If you are in crisis or thinking about suicide, contact a crisis line (in the US call or text 988; in the UK and Ireland Samaritans 116 123)."}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is alcohol use disorder?","acceptedAnswer":{"@type":"Answer","text":"Alcohol use disorder (AUD) is a medical condition in which a person keeps drinking heavily despite harm and finds it hard to control or cut down. Its older, lay name is alcoholism. It is a treatable health condition, not a moral failing. Under DSM-5-TR it is diagnosed when at least 2 of 11 criteria occur within 12 months, and it is rated mild (2-3 criteria), moderate (4-5) or severe (6 or more)."}},{"@type":"Question","name":"How common is alcohol use disorder?","acceptedAnswer":{"@type":"Answer","text":"Very common. In a large US national survey (NESARC-III, 2012-2013), 13.9% of adults had alcohol use disorder in the past year and 29.1% at some point in their lives. It was most common at ages 18-29 (26.7% in the past year). Worldwide, about 100 million people were estimated to have it in 2016, more than any other substance use disorder."}},{"@type":"Question","name":"What are the signs of alcohol withdrawal, and when do they start?","acceptedAnswer":{"@type":"Answer","text":"In a person whose body has adapted to heavy daily drinking, early withdrawal signs such as shaking hands, sweating, a fast heartbeat, anxiety, nausea and poor sleep usually start 6 to 24 hours after the last drink. Seizures are most likely around 24 hours (within about 8 to 48 hours). Delirium tremens, with severe confusion, hallucinations, fever and a racing heart, starts later: 48 to 72 hours in some sources and 72 to 96 hours in the ASAM guideline. It is a medical emergency. Get medical help to stop safely."}},{"@type":"Question","name":"Is it dangerous to stop drinking suddenly?","acceptedAnswer":{"@type":"Answer","text":"It can be. After long, heavy daily drinking, stopping suddenly can cause seizures or delirium tremens, which can be life-threatening. A past withdrawal seizure or delirium tremens is the strongest warning sign. Many people can withdraw safely at home or in a clinic with daily check-ins, and some need a hospital bed. Get medical help to stop safely, and do not mix alcohol with benzodiazepines, opioids or other sedatives."}},{"@type":"Question","name":"Why is thiamine given, and does it have to come before glucose?","acceptedAnswer":{"@type":"Answer","text":"Heavy drinking can use up vitamin B1 (thiamine), and very low thiamine can cause Wernicke encephalopathy, with confusion, unsteady walking and eye problems, which can leave lasting memory problems (Korsakoff syndrome). Thiamine is cheap and is given early, often by injection. The traditional teaching, still in the EFNS guideline, is thiamine before glucose. The ASAM 2020 guideline says thiamine and glucose can be given in either order or together, and low blood sugar should never be left untreated while waiting for thiamine."}},{"@type":"Question","name":"How is alcohol use disorder diagnosed?","acceptedAnswer":{"@type":"Answer","text":"A clinician asks about drinking and its effects, often starting with a screening questionnaire such as the AUDIT or AUDIT-C, and then checks the 11 DSM-5-TR criteria, such as drinking more than intended, failed efforts to cut down, craving, tolerance and withdrawal. Two or more criteria in 12 months make the diagnosis. Blood tests can support the picture but are not part of the criteria. The WHO's ICD-11 uses alcohol dependence and harmful pattern of use instead."}},{"@type":"Question","name":"What medicines treat alcohol use disorder?","acceptedAnswer":{"@type":"Answer","text":"In the US the FDA has approved disulfiram (1951), naltrexone (as a daily tablet from 1994 and a monthly injection from 2006) and acamprosate (2004). Naltrexone can make drinking less rewarding, acamprosate helps people who have stopped stay stopped, and disulfiram causes a very unpleasant reaction if the person drinks. Some medicines approved for other conditions, such as topiramate and gabapentin, are also used. A clinician decides whether one fits, and each works best together with counselling or support. Medicines are rarely used: in 2019 only about 1 in 10 adults in alcohol treatment received one."}},{"@type":"Question","name":"Does alcohol use disorder run in families?","acceptedAnswer":{"@type":"Answer","text":"Partly. Twin and adoption studies estimate that about half of the risk (heritability about 49%) comes from genes, with many genes each adding a little. Genes are risk, not destiny: the rest of the risk comes from environment and life circumstances, and a family is never to blame for someone else's drinking."}},{"@type":"Question","name":"Can people recover from alcohol use disorder?","acceptedAnswer":{"@type":"Answer","text":"Yes, many do. In a US survey, about 9.1% of adults said they used to have a problem with alcohol or drugs and no longer do, and the typical (median) number of serious attempts it took was two. Talking therapies, mutual-help groups such as Alcoholics Anonymous and SMART Recovery, and medicines all help. Only about 1 in 5 people with alcohol use disorder ever get treatment, so asking for help is worthwhile. These are group figures, not a promise for any one person."}}]}</script>

    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:14px;scrollbar-width:none}

/* ---------- type ---------- */

.tag.brand{background:var(--brand-soft);color:var(--brand)} .tag.gaba{background:var(--gaba-soft);color:var(--gaba)} .tag.glu{background:var(--glu-soft);color:var(--glu)} .tag.eth{background:var(--eth-soft);color:var(--eth)} .tag.liver{background:var(--liver-soft);color:var(--liver)} .tag.thi{background:var(--thi-soft);color:var(--thi)} .tag.rx{background:var(--rx-soft);color:var(--rx)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}

.stage-cap{font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.02em}

.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.18}

.ev{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:4px 6px}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

}

main:focus{outline:none}

.icons{display:flex;flex-wrap:wrap;gap:3px}

.calc label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;min-width:0}
.calc select,.calc input[type=number]{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%;min-width:0}
.big-num{font:800 40px/1 var(--display);color:var(--brand)}
/* group colours: 1 understanding, 5 body, family & care and 6 review = the olive brand; 2 screening &
   diagnosis = plum (--dx), 3 withdrawal & acute care = ember (--accent), 4 treatment & recovery = teal (--rx) */

.c-acute .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.c-acute .stepper button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.g-rx .navbtn[aria-current="page"]{background:var(--rx-soft);color:var(--rx)} .g-rx .navbtn[aria-current="page"] .n{color:var(--rx)}
.c-rx .eyebrow{color:var(--rx)} .c-rx .callout{border-left-color:var(--rx)} .c-rx input[type=range]{accent-color:var(--rx)}
.c-rx .btn.primary{background:var(--rx);border-color:var(--rx);color:#fff}
.c-rx .stepper button[aria-pressed="true"]{border-color:var(--rx);background:var(--rx-soft)}
:root[data-theme="dark"] .c-dx .btn.primary,:root[data-theme="dark"] .c-acute .btn.primary,:root[data-theme="dark"] .c-rx .btn.primary{color:#12140d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dx .btn.primary,:root:not([data-theme="light"]) .c-acute .btn.primary,:root:not([data-theme="light"]) .c-rx .btn.primary{color:#12140d}}
/* topic colours for tags, legends and table rows: inhibition, excitation, ethanol, liver, thiamine */
.ev.gaba{background:var(--gaba-soft);color:var(--gaba)} .ev.glu{background:var(--glu-soft);color:var(--glu)}
tr.gaba td,tr.gaba th{background:var(--gaba-soft)} tr.glu td,tr.glu th{background:var(--glu-soft)} tr.liver td,tr.liver th{background:var(--liver-soft)}

/* labels no smaller than 12px */
.brand .sm,.navgroup h3,.navbtn .n,.themebtn,.langbtn,.disclaimer b,.tag,.note .kicker,.kicker,.kv dt,.hook b:first-child,.pt b:first-child,
thead th,.pager small,.stepper button b,.fc .face small,.srcs .key,.unit li .n,.teach b:first-child,.safety b:first-child,.crisis b:first-child,

.sitefoot a{padding-block:14px}
