<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400&display=block" rel="stylesheet">
<style>
:root{
  --bg:#f6eee1; --bg-2:#efe3d0; --panel:#fffaf1; --ink:#2b221c; --muted:#6a5a4e; --line:#e3d5c0;
  --accent:#a5482a; --accent-ink:#fffaf1; --accent-soft:#f3dccd;
  --cup:#a5482a; --steam:#c9a88c; --glow:rgba(255,214,150,.55);
  --alz:#2f6b4f; --alz-soft:#dcebe2; --amber:#905a0c; --rose:#ad3861;
  --fmf:#0d6e78; --fmf-soft:#d5edef; --terra:#c4562f;
  --mg:#1d5f8a; --mg-soft:#dbe8f2; --mg-ab:#b02a55;
  --gout:#2d4a8a; --gout-soft:#dfe6f5; --garnet:#c23a4e;
  --als:#1f5f8b; --als-soft:#dbe8f2; --ochre:#b07400;
  --pd:#2f4f8a; --pd-soft:#dfe6f4; --tulip:#c0392b;
  --ms:#3a47a8; --ms-soft:#e1e4f7; --myelin:#f2c46d; --msorange:#e07a1f;
  --crc:#8a2a56; --crc-soft:#f6dfe9; --mucosa:#f6c2ca; --polyp:#f0a640;
  --eds:#1d1d1d; --eds-soft:#e4e4e1; --zebra:#ffffff; --jade:#00b386;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{color:var(--ink);font-family:var(--body);background:radial-gradient(900px 420px at 15% -80px,var(--glow),transparent 70%),var(--bg);position:relative}
.brand{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:12px;font:700 26px var(--display)}
.brand svg{width:40px;height:40px}
h1{position:absolute;left:72px;top:118px;margin:0;font:500 92px/.98 var(--display);letter-spacing:-2px}
h1 i{display:block;font-weight:400;font-size:42px;color:var(--muted);letter-spacing:-.4px;margin-top:14px}
.shelf{position:absolute;left:72px;right:72px;bottom:96px;display:flex;gap:18px;align-items:flex-end}
.b{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px}
.cv{position:relative;width:100%;aspect-ratio:3/4;max-height:150px;border-radius:5px 10px 10px 5px;background:var(--soft);display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 22px -14px rgba(70,40,15,.5)}
.cv::before{content:"";position:absolute;inset:0 auto 0 0;width:11px;background:var(--c)}
.cv svg{width:54px;height:54px;margin-left:8px}
.b span{font:700 19px var(--display);white-space:nowrap}
.b.alz{--c:var(--alz);--soft:var(--alz-soft)}.b.crc{--c:var(--crc);--soft:var(--crc-soft)}.b.eds{--c:var(--eds);--soft:var(--eds-soft)}.b.fmf{--c:var(--fmf);--soft:var(--fmf-soft)}.b.mg{--c:var(--mg);--soft:var(--mg-soft)}.b.gout{--c:var(--gout);--soft:var(--gout-soft)}.b.als{--c:var(--als);--soft:var(--als-soft)}.b.pd{--c:var(--pd);--soft:var(--pd-soft)}.b.ms{--c:var(--ms);--soft:var(--ms-soft)}
.plank{position:absolute;left:52px;right:52px;bottom:84px;height:10px;border-radius:5px;background:#c79a72}
.f{position:absolute;left:72px;bottom:34px;font-size:19px;color:var(--muted)}
</style></head><body>
<div class="brand"><svg class="cup" viewBox="0 0 48 48" aria-hidden="true"><path d="M17 6c-2 2.5 2 4.5 0 7M24 4c-2 2.5 2 4.5 0 7M31 6c-2 2.5 2 4.5 0 7" fill="none" stroke="var(--steam)" stroke-width="2" stroke-linecap="round"/><path d="M9 17h28v6c0 8-6 14-14 14S9 31 9 23z" fill="var(--cup)"/><path d="M37 20h2.5a4.5 4.5 0 0 1 0 9H36" fill="none" stroke="var(--cup)" stroke-width="3" stroke-linecap="round"/><path d="M4 40h38" stroke="var(--cup)" stroke-width="3" stroke-linecap="round"/></svg>Medical Companions</div>
<h1>Pull up a chair.<i>Let's understand it together, one disease at a time.</i></h1>
<div class="shelf">
<div class="b alz"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--alz)"/><path d="M20 9c-6 0-10 4-10 9 0 3 1 5 3 7v5h7m0-21c6 0 10 4 10 9 0 3-1 5-3 7v5h-7m0-21v21" fill="none" stroke="var(--panel)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="17" r="2.2" fill="var(--amber)"/><circle cx="26" cy="20" r="2" fill="var(--rose)"/></svg></div><span>Alzheimer's</span></div>
<div class="b pd"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--pd)"/><path d="M20 31V19" fill="none" stroke="var(--panel)" stroke-width="2.4" stroke-linecap="round"/><path d="M20 25c-3-1-6-3-6-6M20 23c3-1 5-2 6-5" fill="none" stroke="var(--panel)" stroke-width="2" stroke-linecap="round"/><path d="M14 10c0 6 2 9 6 9s6-3 6-9l-3 3-3-5-3 5z" fill="var(--tulip)" stroke="var(--panel)" stroke-width="1.4" stroke-linejoin="round"/></svg></div><span>Parkinson's</span></div>
<div class="b ms"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--ms)"/><path d="M5 20h30" stroke="var(--panel)" stroke-width="2.4" stroke-linecap="round"/><rect x="8" y="15" width="8" height="10" rx="5" fill="var(--myelin)"/><rect x="24" y="15" width="8" height="10" rx="5" fill="var(--myelin)"/><circle cx="20" cy="20" r="3.4" fill="var(--msorange)"/></svg></div><span>MS</span></div>
<div class="b als"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--als)"/><path d="M12 10l5 5v9l-5 6M28 10l-5 5v9l5 6" fill="none" stroke="var(--panel)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="20" r="3.2" fill="var(--ochre)"/></svg></div><span>ALS</span></div>
<div class="b mg"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--mg)"/><path d="M9 13h9l-3 7h10" fill="none" stroke="var(--panel)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 29q8-6 16 0" fill="none" stroke="var(--mg-ab)" stroke-width="3" stroke-linecap="round"/></svg></div><span>Myasthenia</span></div>
<div class="b gout"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--gout)"/><path d="M11 28L29 12M12 13l16 15M20 8v24" fill="none" stroke="var(--panel)" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="4" fill="var(--garnet)"/></svg></div><span>Gout</span></div>
<div class="b fmf"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--fmf)"/><path d="M5 25c5 0 5-6 10-6s5 6 10 6 5-6 10-6" fill="none" stroke="var(--panel)" stroke-width="3" stroke-linecap="round"/><path d="M9 15l5-6 4 9 5-12 4 9h5" fill="none" stroke="var(--terra)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg></div><span>FMF</span></div>
<div class="b crc"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--crc)"/><path d="M13 29V15q0-4 4-4h6q4 0 4 4v10q0 4-4 4h-2" fill="none" stroke="var(--mucosa)" stroke-width="4" stroke-linecap="round"/><circle cx="27" cy="20" r="3.2" fill="var(--polyp)"/></svg></div><span>Colorectal</span></div>
<div class="b eds"><div class="cv"><svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><clipPath id="edsclips"><circle cx="20" cy="20" r="18"/></clipPath><circle cx="20" cy="20" r="18" fill="var(--eds)"/><g clip-path="url(#edsclips)" fill="none" stroke-linecap="round"><path d="M0 12q5-5 10 0t10 0t10 0t10 0" stroke="var(--zebra)" stroke-width="3.4"/><path d="M0 28q5-5 10 0t10 0t10 0t10 0" stroke="var(--zebra)" stroke-width="3.4"/><path d="M0 20q5 5 10 0t10 0t10 0t10 0" stroke="var(--jade)" stroke-width="4.2"/></g></svg></div><span>EDS</span></div>
</div>
<div class="plank"></div>
<div class="f">%HOST% · free, animated, every claim cited · not medical advice</div>
</body></html>
