<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is colorectal cancer?","acceptedAnswer":{"@type":"Answer","text":"Colorectal cancer is cancer of the colon or rectum, the large bowel. Most begin as a non-cancerous growth on the bowel lining, an adenoma or polyp, that slowly picks up gene changes over years before it becomes invasive. Finding and removing polyps is why screening can prevent some cancers, not only find them early."}},{"@type":"Question","name":"How common is colorectal cancer?","acceptedAnswer":{"@type":"Answer","text":"It is the third most commonly diagnosed cancer worldwide and the second leading cause of cancer death. GLOBOCAN 2024 estimated about 2.04 million new cases and 918,000 deaths a year. In the United States the lifetime chance of developing it is about 4.1% for men and 3.8% for women."}},{"@type":"Question","name":"What are the first symptoms of bowel cancer?","acceptedAnswer":{"@type":"Answer","text":"Bleeding from the bottom or blood in the stool, a lasting change in bowel habit, iron-deficiency anaemia, abdominal pain and unexplained weight loss. Each symptom on its own usually has another cause: in UK primary-care studies rectal bleeding led to a cancer diagnosis in about 2 to 8 in 100 people, more often with age. Anyone with these symptoms should see a clinician, whatever their screening history."}},{"@type":"Question","name":"At what age should colorectal cancer screening start?","acceptedAnswer":{"@type":"Answer","text":"The US Preventive Services Task Force (2021) recommends screening for all adults aged 50 to 75 and for adults aged 45 to 49, and selective screening from 76 to 85. People with a strong family history, Lynch syndrome, FAP or inflammatory bowel disease follow different, earlier schedules set by their specialists."}},{"@type":"Question","name":"Which screening test is best: FIT, stool DNA or colonoscopy?","acceptedAnswer":{"@type":"Answer","text":"Each trades accuracy against effort. In one large study a multitarget stool DNA test found 92.3% of cancers against 73.8% for FIT, but gave more false positives (specificity 86.6% vs 94.9%). Colonoscopy looks at the whole bowel and removes polyps, but needs bowel preparation and sedation. A positive stool or blood test only helps if a colonoscopy follows. Guidelines say the best test is the one that gets done."}},{"@type":"Question","name":"Is colorectal cancer hereditary?","acceptedAnswer":{"@type":"Answer","text":"Partly. Having one first-degree relative with colorectal cancer roughly doubles the risk (pooled relative risk 2.24), and two or more roughly quadruples it. A smaller group of families carries an inherited syndrome such as Lynch syndrome, found in about 1 in 279 people, or familial adenomatous polyposis. Among people diagnosed before 50, 16% carried a germline variant in one study."}},{"@type":"Question","name":"What is the survival rate for colorectal cancer by stage?","acceptedAnswer":{"@type":"Answer","text":"In the United States, 5-year relative survival for people diagnosed in 2015 to 2021 was 91% when the cancer was still localised and 15% when it had spread to distant organs, with regional disease in between. These are statistics for large groups diagnosed years ago, not a prediction for any one person, and treatment keeps improving."}},{"@type":"Question","name":"Why is colorectal cancer rising in younger adults?","acceptedAnswer":{"@type":"Answer","text":"Incidence in US adults under 50 has risen 1 to 2% a year since the mid-1990s, and colorectal cancer is now the leading cause of cancer death in Americans under 50. People born around 1990 have a much higher risk than those born around 1950. The causes are not settled and are an active research question."}}]}</script>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
i,em{font-style:italic}
button{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
svg :focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--brand);color:var(--on-brand);
  padding:10px 16px;border-radius:0 0 10px 0;font-weight:700;text-decoration:none}
.skip:focus{left:0}
@media (forced-colors:active){ .btn,.navbtn,.opt,.nu-q{border:1px solid ButtonText} }
h1,h2,h3,h4{text-wrap:balance}
sup.c{font:600 10px var(--mono);color:var(--brand);cursor:pointer;margin-left:1px;white-space:nowrap}
sup.c:hover{text-decoration:underline}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:282px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);
  padding:22px 16px 28px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;z-index:20}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;text-align:left;white-space:nowrap}
.brand svg{width:36px;height:36px;flex:none}
.brand .sm{display:block;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:6px}
.navgroup h3{font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 2px 10px}
.navgroup ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.navbtn{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;border:0;background:none;font-size:14.5px;cursor:pointer;line-height:1.3}
a.navbtn{color:inherit;text-decoration:none}
.navbtn .n{font:600 11px var(--mono);color:var(--muted);min-width:26px;flex:none}
.navbtn:hover{background:var(--panel-2)}
.navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.navbtn[aria-current="page"] .n{color:var(--brand)}
.g-rx .navbtn[aria-current="page"]{background:var(--rx-soft);color:var(--rx)}
.g-rx .navbtn[aria-current="page"] .n{color:var(--rx)}
.g-dz .navbtn[aria-current="page"]{background:var(--tumour-soft);color:var(--tumour)}
.g-dz .navbtn[aria-current="page"] .n{color:var(--tumour)}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);line-height:1.45;padding-left:10px;display:flex;flex-direction:column;gap:10px}
.themebtn{align-self:flex-start;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.langbtn{align-self:flex-start;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;cursor:pointer;text-decoration:none;color:var(--ink)}
.side-foot .btnrow{display:flex;gap:8px;flex-wrap:wrap}
main{min-width:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.disclaimer{max-width:1120px;margin:0 auto 26px;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--gold-soft);font-size:13.5px;line-height:1.45}
.disclaimer b{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);white-space:nowrap;padding-top:2px}
@media (max-width:600px){.disclaimer{flex-direction:column;gap:2px;font-size:13px;margin-bottom:18px}}
.mod{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sitefoot{max-width:1120px;margin:40px auto 0;border-top:1px solid var(--line);padding-top:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sitefoot b{color:var(--ink)}
@media (min-width:901px){ main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))} }
@media (max-width:900px){
  /* the top bar keeps its own height: with an auto row it would share the 100vh with a short
     main, as on a module page before its script shows the module, then shrink (a layout shift) */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:14px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand{font-size:18px}
  .brand .sm{display:none}
  .brand svg{width:28px;height:28px}
  .navgroup{flex-direction:row;align-items:center}
  .navgroup h3{display:none}
  .navgroup ol{flex-direction:row;gap:4px}
  .navbtn{white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13.5px}
  .side-foot{margin:0;padding:0;flex-direction:row}
  .brand,.side-foot{flex:none}
  .btnrow{flex-wrap:nowrap}
  .side-foot p{display:none}
}

.pt b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);display:block;margin-bottom:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.c-dz .btn.primary{background:var(--tumour);border-color:var(--tumour);color:#fff}
.c-rx .btn.primary{background:var(--rx);border-color:var(--rx);color:#fff}
:root[data-theme="dark"] .c-dz .btn.primary,:root[data-theme="dark"] .c-rx .btn.primary{color:#170e13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dz .btn.primary,:root:not([data-theme="light"]) .c-rx .btn.primary{color:#170e13}}
.tl{flex:1;min-width:170px;display:flex;gap:10px;align-items:center}
input[type=range]{accent-color:var(--brand);width:100%}
.c-dz input[type=range]{accent-color:var(--tumour)} .c-rx input[type=range]{accent-color:var(--rx)}
.readout{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13px var(--mono);color:var(--muted)}
.readout b{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:10px 13px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
thead th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
tbody th{font-weight:700}
tr.hl td,tr.hl th{background:var(--tumour-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.18}
.card p,.card li{font-size:14.5px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#hiYears .tag{cursor:pointer;border:1px solid transparent;text-transform:none;letter-spacing:0;font:500 12.5px var(--body);text-align:left;max-width:100%;white-space:normal}
#hiYears .tag:hover,#hiYears .tag:focus-visible{border-color:var(--brand)}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:10px}
.pager button{background:none;border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;padding:6px 0;max-width:48%}
.pager button.next{text-align:right;margin-left:auto}
.pager small{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager span{font-family:var(--display);font-weight:800;font-size:18px}
.callout{border-left:3px solid var(--brand);padding:4px 0 4px 14px;max-width:72ch}
.c-dz .callout{border-left-color:var(--tumour)} .c-rx .callout{border-left-color:var(--rx)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){ .split2{grid-template-columns:minmax(0,1fr)} }
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.stepper button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stepper button b{font:600 10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.stepper button span{font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.stepper button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.c-dz .stepper button[aria-pressed="true"]{border-color:var(--tumour);background:var(--tumour-soft)}
.c-rx .stepper button[aria-pressed="true"]{border-color:var(--rx);background:var(--rx-soft)}
.stepper button[aria-pressed="true"] b{color:var(--ink)}
.ev{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.ev.est{background:var(--good-soft);color:var(--good)} .ev.early{background:var(--warn-soft);color:var(--warn)} .ev.hyp{background:var(--rx-soft);color:var(--rx)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* ---------- SVG text & parts ---------- */
.t-lbl{font:700 13px var(--body);fill:var(--ink)}
.t-big{font:800 16px var(--display);fill:var(--ink)}
.t-sm{font:500 11px var(--mono);fill:var(--muted)}
.t-xs{font:500 9.5px var(--mono);fill:var(--muted)}
.t-mid{text-anchor:middle}
.t-end{text-anchor:end}
.axis{stroke:var(--line);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.arrow{stroke:var(--muted);stroke-width:1.6;fill:none}
.clk{cursor:pointer}

/* ---------- flashcards, quiz, glossary, sources ---------- */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--brand-soft)}
.fc .front p{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,27px);line-height:1.22}
.fc .back p{font-size:17px}
.fc .face small{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15.5px;display:flex;gap:10px}
.opt .l{font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-radius:10px;padding:12px 14px;background:var(--panel-2);font-size:15px}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.mn{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mn .card b.big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.12}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.gloss b{display:block;font-size:15.5px}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.srcs li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14.5px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;scroll-margin-top:90px}
.srcs li.flash{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.srcs .key{font:600 11px var(--mono);color:var(--brand);letter-spacing:.04em}
.srcs .mods{display:flex;flex-wrap:wrap;gap:4px}
.srcs a,.srcs li>span{overflow-wrap:anywhere;min-width:0}
.srcs .srcnote{font-size:13px;color:var(--muted);border-left:2px solid var(--warn);padding-left:9px}
.gloss div,.card,.note,.expl,.opt{overflow-wrap:break-word}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:4px 6px}
@media (max-width:1180px){ .hero{grid-template-columns:minmax(0,1fr)} }
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.unit h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.unit ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.unit li button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}
.unit li:first-child button{border-top:0}
.unit li button:hover b{color:var(--brand)}
.unit li .n{font:600 11px var(--mono);color:var(--muted);padding-top:4px;grid-row:span 2}
.unit li b{font-size:16px}
.unit li small{color:var(--muted);font-size:14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
/* ---------- colorectal additions ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.g-screen .navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.g-screen .navbtn[aria-current="page"] .n{color:var(--accent)}
.c-screen .eyebrow{color:var(--accent)}
.c-screen .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.c-screen input[type=range]{accent-color:var(--accent)}
.c-screen .stepper button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.c-screen .callout{border-left-color:var(--accent)}
:root[data-theme="dark"] .c-screen .btn.primary{color:#170e13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-screen .btn.primary{color:#170e13}}
:root[data-theme="dark"] .c-dz .btn.primary,:root[data-theme="dark"] .c-rx .btn.primary{color:#170e13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dz .btn.primary,:root:not([data-theme="light"]) .c-rx .btn.primary{color:#170e13}}
.btn.ghost{background:none}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.yes{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.maybe{background:var(--warn-soft);color:var(--warn)}
.tag.lymph{background:var(--lymph-soft);color:var(--lymph)}
.g-dx .navbtn[aria-current="page"]{background:var(--lymph-soft);color:var(--lymph)}
.g-dx .navbtn[aria-current="page"] .n{color:var(--lymph)}
.c-dx .eyebrow{color:var(--lymph)}
.c-dx .btn.primary{background:var(--lymph);border-color:var(--lymph);color:#fff}
.c-dx input[type=range]{accent-color:var(--lymph)}
.c-dx .stepper button[aria-pressed="true"]{border-color:var(--lymph);background:var(--lymph-soft)}
.c-dx .callout{border-left-color:var(--lymph)}
:root[data-theme="dark"] .c-dx .btn.primary{color:#170e13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dx .btn.primary{color:#170e13}}
:root[data-theme="dark"] .c-screen .btn.primary{color:#170e13}
.icons{display:flex;flex-wrap:wrap;gap:3px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px}
.calc label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;min-width:0}
.calc select,.calc input[type=number]{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%;min-width:0}
.big-num{font:800 40px/1 var(--display);color:var(--brand)}
