atment","name":"Interpersonal and social rhythm therapy"},{"@type":"PsychologicalTreatment","name":"Cognitive behavioural therapy"},{"@type":"TherapeuticProcedure","name":"Electroconvulsive therapy"}]},"mainContentOfPage":{"@type":"WebPageElement","cssSelector":"main"},"significantLink":["%SITE%/bipolar-disorder/what/","%SITE%/bipolar-disorder/episodes/","%SITE%/bipolar-disorder/genes/","%SITE%/bipolar-disorder/brain/","%SITE%/bipolar-disorder/criteria/","%SITE%/bipolar-disorder/types/","%SITE%/bipolar-disorder/screening/","%SITE%/bipolar-disorder/differential/","%SITE%/bipolar-disorder/lithium/","%SITE%/bipolar-disorder/levels/","%SITE%/bipolar-disorder/stabilisers/","%SITE%/bipolar-disorder/antipsychotics/","%SITE%/bipolar-disorder/depression/","%SITE%/bipolar-disorder/therapy/","%SITE%/bipolar-disorder/crisis/","%SITE%/bipolar-disorder/pregnancy/","%SITE%/bipolar-disorder/course/","%SITE%/bipolar-disorder/living/","%SITE%/bipolar-disorder/families/","%SITE%/bipolar-disorder/nursing/","%SITE%/bipolar-disorder/frontier/","%SITE%/bipolar-disorder/history/","%SITE%/bipolar-disorder/sources/"],"disclaimer":"Educational synthesis of published literature. Not medical advice, and not a substitute for a clinician. Doses, lithium levels and monitoring schedules are quoted as published in labels and guidelines, never as instructions; suspected lithium toxicity is an emergency. If you are in crisis or thinking about suicide, contact local emergency services or a crisis line (in the US call or text 988; in the UK and Ireland Samaritans 116 123)."}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is bipolar disorder?","acceptedAnswer":{"@type":"Answer","text":"Bipolar disorder is a long-term illness in which mood and energy move between lows (depression) and highs (mania or hypomania), usually with steadier periods in between. It affects more than 1% of the world's population, whatever their nationality, ethnic origin or income, and it usually begins in the teens or twenties. It is treatable, and many people stay well for long periods. If you are in crisis or thinking about suicide, contact local emergency services or a crisis line (in the US call or text 988; in the UK and Ireland Samaritans 116 123)."}},{"@type":"Question","name":"What are the symptoms of mania and hypomania?","acceptedAnswer":{"@type":"Answer","text":"Both are a distinct period of raised, expansive or irritable mood together with increased energy or activity. Other symptoms include talking more or faster, racing thoughts, inflated self-esteem, less need for sleep, being easily distracted, more goal-directed activity, and impulsive or risky behaviour. Mania is not always happy: irritability and restlessness are common. Mania lasts about a week or more, or needs hospital care, causes serious problems and can include psychotic symptoms. Hypomania is milder: DSM-5 requires at least 4 days, and it does not cause marked impairment."}},{"@type":"Question","name":"What is the difference between bipolar I and bipolar II?","acceptedAnswer":{"@type":"Answer","text":"Bipolar I disorder means at least one manic episode. Bipolar II disorder means at least one hypomanic episode and at least one major depressive episode, but never a full manic episode. Bipolar II is not a mild form: in a 13-year study, people with bipolar II had depressive symptoms in about half of all weeks and hypomanic symptoms in only 1.3%."}},{"@type":"Question","name":"How common is bipolar disorder?","acceptedAnswer":{"@type":"Answer","text":"In the World Mental Health surveys of 61,392 adults in 11 countries, 0.6% had bipolar I, 0.4% bipolar II and 1.4% a milder subthreshold form at some point in life: 2.4% in total. A US survey found higher figures (1.0%, 1.1% and 2.4%). Men and women are affected about equally overall, though bipolar II is more common in women. The average age at onset in the worldwide surveys was 18 to 22 years."}},{"@type":"Question","name":"What causes bipolar disorder? Is it genetic?","acceptedAnswer":{"@type":"Answer","text":"Bipolar disorder often runs in families, and twin studies put its heritability at roughly 60 to 85%. No single gene causes it: a 2025 study found 298 regions of the genome, each nudging risk up a little. Genes are not destiny, because even an identical twin of someone with bipolar disorder often stays well. In people who are susceptible, losing sleep, major life events (exciting ones as well as stressful ones) and cannabis use can push mood towards an episode."}},{"@type":"Question","name":"How is bipolar disorder diagnosed?","acceptedAnswer":{"@type":"Answer","text":"A clinician makes the diagnosis from a careful history of mood over time. There is no blood test or brain scan for it. Because the illness often starts with depression, asking about past highs is key, and a family member or friend can help remember them. Questionnaires such as the Mood Disorder Questionnaire can only flag that a closer look is worthwhile. Doctors also check for thyroid problems, medicines such as steroids, and drugs that can cause manic-like states. Getting the right diagnosis often takes years: a median of 6.7 years in one large analysis."}},{"@type":"Question","name":"How does lithium work, and why are blood levels checked?","acceptedAnswer":{"@type":"Answer","text":"Lithium lowers the chance of new mood episodes, especially mania: in placebo-controlled trials it reduced new episodes by about a third, and it reduced suicides compared with placebo. Exactly how it works is still unknown; it affects many steps in cell signalling. Blood levels are checked because the level that works is close to the level that harms. US labels describe a therapeutic range of 0.8 to 1.2 mEq/L and give 1.5 mEq/L or more as toxic. These figures are quoted as published, not as instructions. The test is usually taken about 12 hours after the last dose. Vomiting or diarrhoea, not drinking enough, and some medicines, such as NSAID painkillers, water pills and some blood pressure medicines, can raise the level."}},{"@type":"Question","name":"What are the signs of lithium toxicity?","acceptedAnswer":{"@type":"Answer","text":"The lithium label lists diarrhoea, vomiting, drowsiness, muscle weakness and lack of coordination as possible early signs. Worsening tremor, unsteadiness, slurred speech, blurred vision and confusion can follow, and severe toxicity can cause seizures and coma. Suspected lithium toxicity is a medical emergency: get urgent medical help straight away."}},{"@type":"Question","name":"Can people with bipolar disorder live well and recover?","acceptedAnswer":{"@type":"Answer","text":"Yes. With treatment most episodes end: 98% of people treated in hospital for a first manic episode recovered from it within 2 years. About 40 to 60% of people with established bipolar disorder are employed. Episodes often come back, so long-term treatment, learning about the illness, regular sleep and routines, a written plan for early warning signs, involving family and looking after physical health all help people stay well. If you are in crisis or thinking about suicide, contact local emergency services or a crisis line (in the US call or text 988; in the UK and Ireland Samaritans 116 123)."}}]}</script>

/* a module's own page makes its heading the h1 (tools/build.py); it keeps the h2 size */
h1.mh{font-size:clamp(29px,4.2vw,46px);line-height:1.06;letter-spacing:-.02em}
h3.sub{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:8px 0 0}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.mhead{display:flex;flex-direction:column;gap:10px}
p{margin:0}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.brand{background:var(--brand-soft);color:var(--brand)} .tag.up{background:var(--up-soft);color:var(--up)} .tag.down{background:var(--down-soft);color:var(--down)} .tag.mixed{background:var(--mixed-soft);color:var(--mixed)} .tag.rx{background:var(--rx-soft);color:var(--rx)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- lab layout ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.lab.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1360px){ .lab,.lab.even{grid-template-columns:minmax(0,1fr)} }
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage svg{width:100%;height:auto;display:block}
@media (max-width:820px){ .stage svg{min-width:0!important} .scroll{overflow-x:visible} }
.stage-cap{font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.02em}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.note h4{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.12;letter-spacing:-.01em;margin:0}
.note .kicker,.kicker{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv{margin:0;display:flex;flex-direction:column;gap:10px}
.kv dt{font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
.kv dd{margin:0}
.hook{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.hook b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}
.pt{background:var(--brand-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.pt b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);display:block;margin-bottom:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tl{flex:1;min-width:170px;display:flex;gap:10px;align-items:center}
input[type=range]{accent-color:var(--brand);width:100%}
.readout{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13px var(--mono);color:var(--muted)}
.readout b{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:10px 13px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
thead th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
tbody th{font-weight:700}
tr.hl td,tr.hl th{background:var(--up-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4,.card h3{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.18}
.card p,.card li{font-size:14.5px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#hiYears .tag{cursor:pointer;border:1px solid transparent;text-transform:none;letter-spacing:0;font:500 12.5px var(--body);text-align:left;max-width:100%;white-space:normal}
#hiYears .tag:hover,#hiYears .tag:focus-visible{border-color:var(--brand)}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:10px}
.pager button{background:none;border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;padding:6px 0;max-width:48%}
.pager button.next{text-align:right;margin-left:auto}
.pager small{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager span{font-family:var(--display);font-weight:800;font-size:18px}
.callout{border-left:3px solid var(--brand);padding:4px 0 4px 14px;max-width:72ch}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){ .split2{grid-template-columns:minmax(0,1fr)} }
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.stepper button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stepper button b{font:600 10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.stepper button span{font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.stepper button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.stepper button[aria-pressed="true"] b{color:var(--ink)}
.ev{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.ev.est{background:var(--good-soft);color:var(--good)} .ev.early{background:var(--warn-soft);color:var(--warn)} .ev.hyp{background:var(--rx-soft);color:var(--rx)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* ---------- SVG text & parts ---------- */
.t-lbl{font:700 13px var(--body);fill:var(--ink)}
.t-big{font:800 16px var(--display);fill:var(--ink)}
.t-sm{font:500 11px var(--mono);fill:var(--muted)}
.t-xs{font:500 9.5px var(--mono);fill:var(--muted)}
.t-mid{text-anchor:middle}
.t-end{text-anchor:end}
.axis{stroke:var(--line);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.arrow{stroke:var(--muted);stroke-width:1.6;fill:none}
.clk{cursor:pointer}

/* ---------- flashcards, quiz, glossary, sources ---------- */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--brand-soft)}
.fc .front p{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,27px);line-height:1.22}
.fc .back p{font-size:17px}
.fc .face small{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15.5px;display:flex;gap:10px}
.opt .l{font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-radius:10px;padding:12px 14px;background:var(--panel-2);font-size:15px}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.mn{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mn .card b.big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.12}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.gloss b{display:block;font-size:15.5px}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.srcs li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14.5px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;scroll-margin-top:90px}
.srcs li.flash{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.srcs .key{font:600 11px var(--mono);color:var(--brand);letter-spacing:.04em}
.srcs .mods{display:flex;flex-wrap:wrap;gap:4px}
.srcs a,.srcs li>span{overflow-wrap:anywhere;min-width:0}
.srcs .srcnote{font-size:13px;color:var(--muted);border-left:2px solid var(--warn);padding-left:9px}
.gloss div,.card,.note,.expl,.opt{overflow-wrap:break-word}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:4px 6px}
@media (max-width:1180px){ .hero{grid-template-columns:minmax(0,1fr)} }
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.unit h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.unit ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.unit li button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}
.unit li:first-child button{border-top:0}
.unit li button:hover b{color:var(--brand)}
.unit li .n{font:600 11px var(--mono);color:var(--muted);padding-top:4px;grid-row:span 2}
.unit li b{font-size:16px}
.unit li small{color:var(--muted);font-size:14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
/* ---------- Bipolar additions ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.tag.accent{background:var(--accent-soft);color:var(--accent)} .tag.dx{background:var(--dx-soft);color:var(--dx)} .tag.rx{background:var(--rx-soft);color:var(--rx)}
.btn.ghost{background:none}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.yes{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.maybe{background:var(--warn-soft);color:var(--warn)}
.icons{display:flex;flex-wrap:wrap;gap:3px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px}
.calc label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;min-width:0}
.calc select,.calc input[type=number]{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%;min-width:0}
.big-num{font:800 40px/1 var(--display);color:var(--brand)}
/* group colours: 1 understanding, 5 course & living and 6 review = the pine brand; 2 diagnosis = plum-indigo (--dx),
   3 medicines = teal (--rx), 4 therapy, safety & pregnancy = warm clay (--accent) */
.g-dx .navbtn[aria-current="page"]{background:var(--dx-soft);color:var(--dx)} .g-dx .navbtn[aria-current="page"] .n{color:var(--dx)}
.c-dx .eyebrow{color:var(--dx)} .c-dx .callout{border-left-color:var(--dx)} .c-dx input[type=range]{accent-color:var(--dx)}
.c-dx .btn.primary{background:var(--dx);border-color:var(--dx);color:#fff}
.c-dx .stepper button[aria-pressed="true"]{border-color:var(--dx);background:var(--dx-soft)}
.g-rx .navbtn[aria-current="page"]{background:var(--rx-soft);color:var(--rx)} .g-rx .navbtn[aria-current="page"] .n{color:var(--rx)}
.c-rx .eyebrow{color:var(--rx)} .c-rx .callout{border-left-color:var(--rx)} .c-rx input[type=range]{accent-color:var(--rx)}
.c-rx .btn.primary{background:var(--rx);border-color:var(--rx);color:#fff}
.c-rx .stepper button[aria-pressed="true"]{border-color:var(--rx);background:var(--rx-soft)}
.g-care .navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)} .g-care .navbtn[aria-current="page"] .n{color:var(--accent)}
.c-care .eyebrow{color:var(--accent)} .c-care .callout{border-left-color:var(--accent)} .c-care input[type=range]{accent-color:var(--accent)}
.c-care .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.c-care .stepper button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
:root[data-theme="dark"] .c-dx .btn.primary,:root[data-theme="dark"] .c-rx .btn.primary,:root[data-theme="dark"] .c-care .btn.primary{color:#0f1613}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dx .btn.primary,:root:not([data-theme="light"]) .c-rx .btn.primary,:root:not([data-theme="light"]) .c-care .btn.primary{color:#0f1613}}
/* the two poles, for tags, legends and table rows */
.ev.up{background:var(--up-soft);color:var(--up)} .ev.down{background:var(--down-soft);color:var(--down)}
tr.up td,tr.up th{background:var(--up-soft)} tr.down td,tr.down th{background:var(--down-soft)}
/* crisis line: on the home page and in every module that touches suicide or self-harm */
.crisis{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:15px;max-width:72ch}
.crisis b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap;padding-top:3px}
@media (max-width:600px){.crisis{flex-direction:column;gap:2px}}
.disclaimer .crisisline{display:block;margin-top:4px;font-weight:700}
/* the crawler outline's title in <noscript> is not a heading (it came before the h1); it looks like one */
[dir=rtl] .nsh{letter-spacing:0;line-height:1.12}
/* labels no smaller than 12px */
.brand .sm,.navgroup h3,.navbtn .n,.themebtn,.langbtn,.disclaimer b,.tag,.note .kicker,.kicker,.kv dt,.hook b:first-child,.pt b:first-child,
thead th,.pager small,.stepper button b,.fc .face small,.srcs .key,.unit li .n,.teach b:first-child,.safety b:first-child,.crisis b:first-child,
.callnow b:first-child,.banner b:first-child{font-size:12px}
/* tap targets of at least 44px. A footer link grows its hit area with padding that takes no room in the line.
   On a phone the chips keep their look: the visible pill is the padding box (its outline an inset shadow)
   and a transparent border above and below makes the target 44px tall; the bar's own padding shrinks to match */
.sitefoot a{padding-block:14px}
@media (max-width:900px){
  .side{padding-block:4px}
  .brand{min-height:44px}
  .navbtn{border:0;border-block:6px solid transparent;padding:7px 11px;background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--line)}
  .themebtn,.langbtn{border:0;border-block:8px solid transparent;padding:7px 11px;background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--line)}
}
@media (max-width:900px) and (forced-colors:active){
  .side{padding-block:10px}
  .navbtn,.themebtn,.langbtn{border:1px solid ButtonText;padding:6px 10px}
}
</style>
</head>
<body>
