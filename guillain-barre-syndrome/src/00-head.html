<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is Guillain-Barré syndrome?", "acceptedAnswer": {"@type": "Answer", "text": "Guillain-Barré syndrome (GBS) happens when the immune system attacks the nerves outside the brain and spinal cord, usually after an infection. It often starts as weakness or tingling in the legs that spreads upward over days."}}, {"@type": "Question", "name": "How common is Guillain-Barré syndrome?", "acceptedAnswer": {"@type": "Answer", "text": "It is rare. A 2024 global meta-analysis put the incidence at about 1.1 per 100,000 people per year. It is somewhat more common in men, and the risk rises with age, but children can get it too."}}, {"@type": "Question", "name": "What causes Guillain-Barré syndrome?", "acceptedAnswer": {"@type": "Answer", "text": "About two-thirds of people have an infection in the weeks before, such as Campylobacter jejuni gastroenteritis or a respiratory infection. In some, antibodies made against the germ also recognise molecules on nerves, a process called molecular mimicry."}}, {"@type": "Question", "name": "How quickly does GBS get worse?", "acceptedAnswer": {"@type": "Answer", "text": "Most people reach their weakest point within 2 weeks, and by definition within 4 weeks. A plateau follows, then a slow recovery over months. Rapidly worsening weakness, or trouble breathing or swallowing, needs emergency care."}}, {"@type": "Question", "name": "How is GBS treated?", "acceptedAnswer": {"@type": "Answer", "text": "Intravenous immunoglobulin (IVIg) and plasma exchange both speed recovery in people who cannot walk unaided, and trials found them about equally effective. Steroids alone did not help. Careful monitoring of breathing, blood pressure and heart rhythm, and good supportive care, matter as much."}}, {"@type": "Question", "name": "Do people with GBS need a ventilator?", "acceptedAnswer": {"@type": "Answer", "text": "About 1 in 5 people with GBS develops breathing failure and needs mechanical ventilation for a time, which is why breathing is checked repeatedly in hospital."}}, {"@type": "Question", "name": "Do people recover from Guillain-Barré syndrome?", "acceptedAnswer": {"@type": "Answer", "text": "Most do, often slowly. In large studies about 8 in 10 people were walking without help by 6 months. Some keep weakness, pain or tiredness, and recovery can continue for years. These are figures for groups, not predictions for one person."}}, {"@type": "Question", "name": "Can you get GBS twice?", "acceptedAnswer": {"@type": "Answer", "text": "It is uncommon. Studies report a recurrence in roughly 2 to 5 in every 100 people."}}]}</script>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}

.app{display:grid;grid-template-columns:282px minmax(0,1fr);min-height:100vh}

.navbtn[aria-current="page"] .n{color:var(--brand)}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);line-height:1.45;padding-left:10px;display:flex;flex-direction:column;gap:10px}
.themebtn{align-self:flex-start;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted)}

/* ---------- type ---------- */

.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.brand{background:var(--brand-soft);color:var(--brand)} .tag.accent{background:var(--accent-soft);color:var(--accent)} .tag.dx{background:var(--dx-soft);color:var(--dx)} .tag.rx{background:var(--rx-soft);color:var(--rx)} .tag.rec{background:var(--rec-soft);color:var(--rec)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}

.note h4{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.12;letter-spacing:-.01em;margin:0}

.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1.2;transition:background .15s,border-color .15s}

.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

tr:last-child td{border-bottom:0}

tbody th{font-weight:700}
tr.hl td,tr.hl th{background:var(--brand-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4,.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.18}

.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:10px}

.stepper button span{font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.stepper button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.stepper button[aria-pressed="true"] b{color:var(--ink)}
.ev{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.ev.est{background:var(--good-soft);color:var(--good)} .ev.early{background:var(--warn-soft);color:var(--warn)} .ev.hyp{background:var(--rx-soft);color:var(--rx)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono);color:var(--muted)}

/* ---------- SVG text & parts ---------- */
.t-lbl{font:700 13px var(--body);fill:var(--ink)}

/* ---------- flashcards, quiz, glossary, sources ---------- */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}

.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}

.opt .l{font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.opt:hover:not([disabled]){border-color:var(--brand)}

.expl{border-radius:10px;padding:12px 14px;background:var(--panel-2);font-size:15px}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}

.srcs li.flash{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.srcs .key{font:600 11px var(--mono);color:var(--brand);letter-spacing:.04em}
.srcs .mods{display:flex;flex-wrap:wrap;gap:4px}
.srcs a,.srcs li>span{overflow-wrap:anywhere;min-width:0}

.gloss div,.card,.note,.expl,.opt{overflow-wrap:break-word}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:4px 6px}
@media (max-width:1180px){ .hero{grid-template-columns:minmax(0,1fr)} }
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.unit h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px}

.unit li button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
/* ---------- GBS Companion additions ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.btn.ghost{background:none}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.yes{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.maybe{background:var(--warn-soft);color:var(--warn)}
.icons{display:flex;flex-wrap:wrap;gap:3px}

.calc select,.calc input[type=number]{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%;min-width:0}
.big-num{font:700 40px/1 var(--display);color:var(--brand)}
/* group colours: 1 understanding GBS and 6 review = the indigo brand; 2 diagnosis = teal (--dx),
   3 acute care = crimson (--rx), 4 recovery = green (--rec), 5 special situations & care = steel blue (--care) */
.g-dx .navbtn[aria-current="page"]{background:var(--dx-soft);color:var(--dx)} .g-dx .navbtn[aria-current="page"] .n{color:var(--dx)}
.c-dx .eyebrow{color:var(--dx)} .c-dx .callout{border-left-color:var(--dx)} .c-dx input[type=range]{accent-color:var(--dx)}

.g-rec .navbtn[aria-current="page"]{background:var(--rec-soft);color:var(--rec)} .g-rec .navbtn[aria-current="page"] .n{color:var(--rec)}
.c-rec .eyebrow{color:var(--rec)} .c-rec .callout{border-left-color:var(--rec)} .c-rec input[type=range]{accent-color:var(--rec)}
.c-rec .btn.primary{background:var(--rec);border-color:var(--rec);color:#fff}
.c-rec .stepper button[aria-pressed="true"]{border-color:var(--rec);background:var(--rec-soft)}
.g-care .navbtn[aria-current="page"]{background:var(--care-soft);color:var(--care)} .g-care .navbtn[aria-current="page"] .n{color:var(--care)}
.c-care .eyebrow{color:var(--care)} .c-care .callout{border-left-color:var(--care)} .c-care input[type=range]{accent-color:var(--care)}
.c-care .btn.primary{background:var(--care);border-color:var(--care);color:#fff}
.c-care .stepper button[aria-pressed="true"]{border-color:var(--care);background:var(--care-soft)}
:root[data-theme="dark"] .c-dx .btn.primary,:root[data-theme="dark"] .c-rx .btn.primary,:root[data-theme="dark"] .c-rec .btn.primary,:root[data-theme="dark"] .c-care .btn.primary{color:#121019}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dx .btn.primary,:root:not([data-theme="light"]) .c-rx .btn.primary,:root:not([data-theme="light"]) .c-rec .btn.primary,:root:not([data-theme="light"]) .c-care .btn.primary{color:#121019}}
/* topic colours for tags, .ev labels and table rows: demy (myelin attack, AIDP), axonal (AMAN), mfs (Miller Fisher), tx (treatment) */
.tag.demy{background:var(--brand-soft);color:var(--brand)} .tag.axonal{background:var(--warn-soft);color:var(--warn)} .tag.mfs{background:var(--dx-soft);color:var(--dx)} .tag.tx{background:var(--rx-soft);color:var(--rx)}
.ev.demy{background:var(--brand-soft);color:var(--brand)} .ev.axonal{background:var(--warn-soft);color:var(--warn)} .ev.mfs{background:var(--dx-soft);color:var(--dx)} .ev.tx{background:var(--rx-soft);color:var(--rx)}
tr.demy td,tr.demy th{background:var(--brand-soft)} tr.axonal td,tr.axonal th{background:var(--warn-soft)} tr.mfs td,tr.mfs th{background:var(--dx-soft)} tr.tx td,tr.tx th{background:var(--rx-soft)}
/* a "teaching tool, not for diagnosis or treatment decisions" notice beside every calculator, band explainer,
   eligibility table and diagnostic flow. Markup: <p class="teach" role="note"><b>Teaching tool</b>...</p> */
.teach{border-left:4px solid var(--dx);background:var(--dx-soft);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px;max-width:72ch}
.teach b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dx);display:block;margin-bottom:2px}
/* the urgent-care box, for pages that name urgent signs (weakness that worsens fast, trouble breathing or swallowing).
   Markup: <p class="crisis" role="note"><b>Emergency</b><span>...</span></p> (.callnow is the same box; .callnow.big the

.crisis,.callnow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:10px 14px;font-size:15px;max-width:72ch}
