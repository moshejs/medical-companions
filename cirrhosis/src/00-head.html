<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is cirrhosis of the liver?", "acceptedAnswer": {"@type": "Answer", "text": "Cirrhosis is long-term scarring of the liver. After years of inflammation, healthy liver tissue is replaced by fibrous scar and lumpy regenerating nodules. The scarring makes it harder for blood to flow through the liver, which raises pressure in the portal vein, and over time makes it harder for the liver to do its jobs."}}, {"@type": "Question", "name": "What causes cirrhosis?", "acceptedAnswer": {"@type": "Answer", "text": "Cirrhosis has many causes, not only alcohol. The commonest are fatty liver disease linked to excess weight and diabetes (MASLD), hepatitis B and C, and high alcohol intake. Others include autoimmune and bile-duct diseases and inherited iron or copper overload. Many people have more than one cause. Worldwide, hepatitis B caused the largest share of cirrhosis deaths in 2017, and fatty liver disease is the fastest-growing cause."}}, {"@type": "Question", "name": "What are the symptoms and warning signs of cirrhosis?", "acceptedAnswer": {"@type": "Answer", "text": "Early (compensated) cirrhosis often causes no symptoms: in one US survey about 7 in 10 people with cirrhosis did not know they had liver disease. Common day-to-day symptoms include muscle cramps, poor sleep, itch and sexual problems. Warning signs that the liver is struggling are a swelling belly from fluid, confusion or drowsiness, vomiting blood or black stools, and yellow skin or eyes. Vomiting blood, black or tarry stools, new confusion or drowsiness, or fever or belly pain with a swollen abdomen need urgent care: call your local emergency number or go to an emergency department."}}, {"@type": "Question", "name": "How is cirrhosis diagnosed, and what are FIB-4 and FibroScan?", "acceptedAnswer": {"@type": "Answer", "text": "Doctors combine blood tests, scans and sometimes a liver biopsy. FIB-4 is a free score made from age and three routine blood tests (AST, ALT and platelets); it helps decide who needs further testing but is not a diagnosis. FibroScan (transient elastography) uses a gentle pulse to measure how stiff the liver is, and stiffer usually means more scarring. Results can be affected by eating or a difficult scan, so a high result is often repeated. The calculators in this guide are teaching tools, not for diagnosis."}}, {"@type": "Question", "name": "What do the Child–Pugh and MELD scores mean?", "acceptedAnswer": {"@type": "Answer", "text": "Both scores describe how severe liver disease is for groups of people. Child–Pugh adds points for ascites, encephalopathy, bilirubin, albumin and clotting time, giving class A, B or C. MELD is calculated from blood tests (bilirubin, creatinine and INR, with sodium in MELD-Na and also sex and albumin in MELD 3.0) and is used to rank people waiting for a donor liver. They cannot predict what will happen to any one person."}}, {"@type": "Question", "name": "What is hepatic encephalopathy?", "acceptedAnswer": {"@type": "Answer", "text": "Hepatic encephalopathy is a change in brain function that happens when the liver cannot clear toxins, mainly ammonia, from the blood. It can be so mild that only special tests detect it, or it can cause confusion, sleepiness and even coma. Infections, bleeding, constipation, dehydration and some medicines can trigger an episode. Lactulose and rifaximin are used to treat and prevent it. New confusion or drowsiness needs urgent care."}}, {"@type": "Question", "name": "Can cirrhosis be reversed?", "acceptedAnswer": {"@type": "Answer", "text": "Sometimes, in part. Treating the cause, such as curing hepatitis C, suppressing hepatitis B or stopping alcohol, lowers pressure in the liver in most people and reduces the risk of complications. Some people's scarring regresses, and some people with decompensated cirrhosis become stable again (recompensation): in one large study about 1 in 3 people with alcohol-related cirrhosis who stopped drinking did so within 5 years. Some scarring usually remains, so check-ups continue."}}, {"@type": "Question", "name": "How long can a person live with cirrhosis?", "acceptedAnswer": {"@type": "Answer", "text": "It depends greatly on the stage and on whether the cause can be treated. In large studies, median survival was over 12 years in compensated cirrhosis and under 2 years after decompensation (complications such as ascites, bleeding or confusion). These are averages for large groups from past studies and cannot predict what will happen to any one person. Liver transplant can be a treatment when the liver is failing; more than 10,000 were done in the US in 2023."}}, {"@type": "Question", "name": "Why is liver cancer screening offered to people with cirrhosis?", "acceptedAnswer": {"@type": "Answer", "text": "People with cirrhosis have a higher risk of liver cancer (hepatocellular carcinoma): about 1% to 4% develop it each year. Guidelines such as AASLD 2023 describe surveillance with an ultrasound, often with an AFP blood test, about every 6 months, because cancer found early is more often treatable with surgery, ablation or transplant. The risk falls but does not disappear after hepatitis C is cured, so surveillance continues."}}]}</script>
