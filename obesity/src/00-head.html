"Semaglutide","drugClass":{"@type":"DrugClass","name":"GLP-1 receptor agonists"}},{"@type":"Drug","name":"Liraglutide","drugClass":{"@type":"DrugClass","name":"GLP-1 receptor agonists"}},{"@type":"Drug","name":"Tirzepatide","drugClass":{"@type":"DrugClass","name":"GIP and GLP-1 receptor agonists"}},{"@type":"TherapeuticProcedure","name":"Metabolic and bariatric surgery"}]},"mainContentOfPage":{"@type":"WebPageElement","cssSelector":"main"},"significantLink":["%SITE%/obesity/what/","%SITE%/obesity/measuring/","%SITE%/obesity/causes/","%SITE%/obesity/appetite/","%SITE%/obesity/adipose/","%SITE%/obesity/adaptation/","%SITE%/obesity/complications/","%SITE%/obesity/diabetes/","%SITE%/obesity/assessment/","%SITE%/obesity/stigma/","%SITE%/obesity/lifestyle/","%SITE%/obesity/glp/","%SITE%/obesity/medtrials/","%SITE%/obesity/othermeds/","%SITE%/obesity/sideeffects/","%SITE%/obesity/surgery/","%SITE%/obesity/aftersurgery/","%SITE%/obesity/children/","%SITE%/obesity/pregnancy/","%SITE%/obesity/living/","%SITE%/obesity/nursing/","%SITE%/obesity/frontier/","%SITE%/obesity/history/","%SITE%/obesity/review/","%SITE%/obesity/quiz/","%SITE%/obesity/glossary/","%SITE%/obesity/sources/"],"disclaimer":"Educational synthesis of published literature. Not medical advice, and not a substitute for a doctor, nurse or dietitian. Obesity is a chronic disease with genetic, biological, environmental and social causes, not a failure of willpower. BMI, waist and staging tools here are teaching aids, never a diagnosis or a target. Doses, schedules and guideline statements are quoted as published, never as instructions; do not start, stop or change a medicine without a clinician. Weight-change figures are population averages from trials, not predictions for any person."}</script>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is obesity?","acceptedAnswer":{"@type":"Answer","text":"Obesity is a chronic disease in which excess body fat, sometimes stored in the wrong places or not working normally, harms health. Its causes include genes, biology, the environment, psychological and social factors, so it is not a failure of willpower. Since 2025 the Lancet Commission has separated clinical obesity, where excess fat is already changing how organs work or limiting daily activities, from preclinical obesity, where organs still work normally but the risk of illness is higher."}},{"@type":"Question","name":"How is obesity measured, and is BMI enough?","acceptedAnswer":{"@type":"Answer","text":"Body mass index (BMI) is weight in kilograms divided by height in metres squared. In the WHO adult classification, 25 to 29.9 is overweight and 30 or more is obesity, in classes I, II and III starting at 30, 35 and 40. BMI is quick but cannot tell fat from muscle: a BMI of 30 or more misses about half of adults with excess body fat, and health risks can start at lower BMI in people of south Asian, Chinese, Arab or Black background. The Lancet Commission therefore asks for a second measure, such as waist circumference, waist-to-height ratio or a direct body-fat scan, except when BMI is above 40. Children are assessed on growth charts for their age and sex."}},{"@type":"Question","name":"How common is obesity?","acceptedAnswer":{"@type":"Answer","text":"In 2022 more than 1 billion people worldwide were living with obesity: 504 million women, 374 million men and about 159 million children and adolescents aged 5 to 19. Between 1990 and 2022 adult obesity rose from 8.8% to 18.5% in women and from 4.8% to 14.0% in men. In the United States, 40.3% of adults had obesity in 2021 to 2023, and 9.4% had severe obesity. These are population figures, not predictions for any one person."}},{"@type":"Question","name":"What causes obesity?","acceptedAnswer":{"@type":"Answer","text":"Many things together. Genes matter a great deal: identical twins raised apart have very similar BMIs, and hundreds of small gene differences each nudge weight a little, while a few people have a single powerful change, such as in MC4R or leptin, that causes constant hunger. The surroundings load the effect of those genes: in one study people ate about 500 calories a day more on ultra-processed food, short sleep raises hunger hormones, some medicines cause weight gain, and income and neighbourhood play a part. Obesity is not a choice or a lack of willpower."}},{"@type":"Question","name":"Why does lost weight so often come back?","acceptedAnswer":{"@type":"Answer","text":"Because the body defends its weight. After weight loss, hormones that signal fullness (such as leptin and PYY) fall, the hunger hormone ghrelin rises, and people feel hungrier; in one study these changes were still present a year later. The body also burns a little less energy than expected. Regain is biology, not weakness, and it is one main reason obesity is treated as a long-term condition."}},{"@type":"Question","name":"How do GLP-1 medicines such as semaglutide and tirzepatide work?","acceptedAnswer":{"@type":"Answer","text":"GLP-1 is a hormone the gut releases after a meal. It helps the pancreas release insulin when blood sugar is high, lowers glucagon, slows stomach emptying and acts on appetite areas of the brain, so people feel full sooner. Natural GLP-1 lasts only minutes; semaglutide is a long-acting copy given once a week, and tirzepatide acts on both the GIP and the GLP-1 receptors. In the main trials, average weight loss was about 15% with semaglutide 2.4 mg at 68 weeks and up to about 21% with the highest dose of tirzepatide at 72 weeks; these are averages, not predictions. Do not start, stop or change a medicine without a clinician, and note that compounded or online products are not the same as FDA-approved medicines."}},{"@type":"Question","name":"What happens when someone stops a weight-loss medicine?","acceptedAnswer":{"@type":"Answer","text":"Weight tends to come back. In the STEP 1 extension, people who stopped semaglutide and lifestyle support regained about two thirds of the weight they had lost within a year, and most of the heart and metabolic improvements moved back toward where they started. In SURMOUNT-4, people switched from tirzepatide to placebo regained 14% of their weight, while those who continued lost a further 5.5%. This reflects obesity as a chronic disease, not personal failure; decisions about stopping belong with a clinician."}},{"@type":"Question","name":"What health problems are linked to obesity?","acceptedAnswer":{"@type":"Answer","text":"Obesity raises the chance of many other conditions, including type 2 diabetes (the strongest link), high blood pressure, coronary heart disease, heart failure, atrial fibrillation, stroke, blood clots, obstructive sleep apnoea, fatty liver disease, knee osteoarthritis, back pain, gallbladder disease and 13 types of cancer, and it is linked with depression in both directions. High BMI was estimated to cause 4.0 million deaths worldwide in 2015. These are group averages and do not predict what will happen to any one person."}},{"@type":"Question","name":"Who is offered metabolic and bariatric surgery, and how well does it work?","acceptedAnswer":{"@type":"Answer","text":"The 2022 ASMBS and IFSO statement recommends surgery for adults with a BMI above 35, whether or not they have other conditions, and says it should be considered at a BMI of 30 to 34.9 with metabolic disease, with lower thresholds for people of Asian descent. The most common operations are the sleeve gastrectomy and the Roux-en-Y gastric bypass. In the long Swedish SOS study, people who had surgery lost far more weight than people with usual care, kept much of it off for 20 years, and lived about 3 years longer on average. Surgery has risks, including leaks, vitamin and mineral deficiencies and, after a bypass, a higher risk of alcohol problems, so it needs lifelong follow-up. These are population results and published criteria, not advice for any one person."}}]}</script>

    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:14px;scrollbar-width:none}

.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}

tbody th{font-weight:700}
tr.hl td,tr.hl th{background:var(--brand-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4,.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.18}

.ev.est{background:var(--good-soft);color:var(--good)} .ev.early{background:var(--warn-soft);color:var(--warn)} .ev.hyp{background:var(--hl-soft);color:var(--hl)}

/* ---------- flashcards, quiz, glossary, sources ---------- */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}

.opt:hover:not([disabled]){border-color:var(--brand)}

.mn{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mn .card b.big{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.12}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:4px 6px}
@media (max-width:1180px){ .hero{grid-template-columns:minmax(0,1fr)} }
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ---------- Obesity Companion additions ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main:focus{outline:none}
.btn.ghost{background:none}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.yes{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--bad-soft);color:var(--bad)} .verdict.maybe{background:var(--warn-soft);color:var(--warn)}
.icons{display:flex;flex-wrap:wrap;gap:3px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px}
.calc label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;min-width:0}
.calc select,.calc input[type=number]{font:inherit;font-weight:400;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%;min-width:0}
.big-num{font:700 40px/1 var(--display);color:var(--brand)}
/* group colours: 1 understanding obesity and 5 context & review = the teal brand; 2 health & assessment = berry (--hl),
   3 treatment = medicine blue (--tx), 4 across life & care = leaf green (--life) */
.g-hl .navbtn[aria-current="page"]{background:var(--hl-soft);color:var(--hl)} .g-hl .navbtn[aria-current="page"] .n{color:var(--hl)}
.c-hl .eyebrow{color:var(--hl)} .c-hl .callout{border-left-color:var(--hl)} .c-hl input[type=range]{accent-color:var(--hl)}
.c-hl .btn.primary{background:var(--hl);border-color:var(--hl);color:#fff}
.c-hl .stepper button[aria-pressed="true"]{border-color:var(--hl);background:var(--hl-soft)}
.g-tx .navbtn[aria-current="page"]{background:var(--tx-soft);color:var(--tx)} .g-tx .navbtn[aria-current="page"] .n{color:var(--tx)}
.c-tx .eyebrow{color:var(--tx)} .c-tx .callout{border-left-color:var(--tx)} .c-tx input[type=range]{accent-color:var(--tx)}
.c-tx .btn.primary{background:var(--tx);border-color:var(--tx);color:#fff}
.c-tx .stepper button[aria-pressed="true"]{border-color:var(--tx);background:var(--tx-soft)}
.g-life .navbtn[aria-current="page"]{background:var(--life-soft);color:var(--life)} .g-life .navbtn[aria-current="page"] .n{color:var(--life)}
.c-life .eyebrow{color:var(--life)} .c-life .callout{border-left-color:var(--life)} .c-life input[type=range]{accent-color:var(--life)}
.c-life .btn.primary{background:var(--life);border-color:var(--life);color:#fff}
.c-life .stepper button[aria-pressed="true"]{border-color:var(--life);background:var(--life-soft)}
:root[data-theme="dark"] .c-hl .btn.primary,:root[data-theme="dark"] .c-tx .btn.primary,:root[data-theme="dark"] .c-life .btn.primary{color:#0e1514}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-hl .btn.primary,:root:not([data-theme="light"]) .c-tx .btn.primary,:root:not([data-theme="light"]) .c-life .btn.primary{color:#0e1514}}
/* topic colours for tags, .ev labels and table rows: fat (adipose tissue, apricot), hl (health and complications, berry),
   tx (treatment and medicines, blue), life (life stages and care, green); .rx and .dx are aliases of tx and hl */
.tag.fat{background:var(--accent-soft);color:var(--accent)} .tag.hl,.tag.dx{background:var(--hl-soft);color:var(--hl)} .tag.tx,.tag.rx{background:var(--tx-soft);color:var(--tx)} .tag.life,.tag.rec{background:var(--life-soft);color:var(--life)}
.ev.fat{background:var(--accent-soft);color:var(--accent)} .ev.hl{background:var(--hl-soft);color:var(--hl)} .ev.tx{background:var(--tx-soft);color:var(--tx)} .ev.life{background:var(--life-soft);color:var(--life)}
tr.fat td,tr.fat th{background:var(--accent-soft)} tr.hl td,tr.hl th{background:var(--hl-soft)} tr.tx td,tr.tx th{background:var(--tx-soft)} tr.life td,tr.life th{background:var(--life-soft)}
/* a "teaching tool, not a diagnosis or a target" notice beside every calculator (BMI, waist-to-height, EOSS), band
   explainer and eligibility table. Markup: <p class="teach" role="note"><b>Teaching tool</b>...</p> */
.teach{border-left:4px solid var(--tx);background:var(--tx-soft);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px;max-width:72ch}
.teach b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx);display:block;margin-bottom:2px}
/* the urgent-care box, for pages that name urgent signs (after surgery: fast heart rate, fever, worsening belly pain;
   with medicines: severe belly pain, signs of dehydration). Markup: <p class="crisis" role="note"><b>Urgent</b><span>...</span></p>
   (.callnow is the same box). Seeking urgent care is the one direct instruction the guide gives, cited. */
.crisis,.callnow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:10px 14px;font-size:15px;max-width:72ch}
.crisis b:first-child,.callnow b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--bad);white-space:nowrap;padding-top:3px}
@media (max-width:600px){.crisis,.callnow{flex-direction:column;gap:2px}}
/* a gentle support box for mood, stigma, caring and loss */
.support{border-left:4px solid var(--life);background:var(--life-soft);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px;max-width:72ch}
.support b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--life);display:block;margin-bottom:2px}

   <p class="edcare" role="note"><b>If eating or weight is distressing</b>If eating or weight causes distress, or someone
   restricts, binges or purges, talk to a clinician or an eating-disorder service.</p> */
.edcare{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15px;max-width:72ch}
.edcare b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
/* home hero legend: hormone keys drawn by hormoneDot() */
.hero-key{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12px var(--mono);color:var(--muted)}
.hero-key svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
