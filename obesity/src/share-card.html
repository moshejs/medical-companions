<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Rubik:wght@400;700&family=Source+Code+Pro:wght@400;700&display=swap">
<style>
/* Obesity Companion share card, 1200x630: python3 tools/share_card.py obesity/src/share-card.html obesity/share-card.png */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0e1514;color:#e6efed;font-family:'Rubik',sans-serif}
.l{position:absolute;left:76px;top:50px;width:640px}
.k{font:700 23px 'Source Code Pro',monospace;letter-spacing:.14em;text-transform:uppercase;color:#5fd0bd}
h1{font:700 88px/1 'Lora',serif;letter-spacing:-.015em;margin:18px 0 24px}
p{font-size:26px;line-height:1.36;color:#a2b3af;margin:0 0 28px;max-width:600px}
.chips{display:flex;flex-wrap:wrap;gap:10px;max-width:640px}
.chips span{font:700 17px 'Source Code Pro',monospace;padding:8px 13px;border-radius:999px;border:1px solid #2d3b38}
.chips .a{color:#5fd0bd;background:#12352f;border-color:#21564d}.chips .b{color:#92bbf2;background:#15263c;border-color:#2a4466}.chips .c{color:#f2a26f;background:#3a2416;border-color:#64401f}.chips .d{color:#a8d67c;background:#1c3013;border-color:#345324}
.url{position:absolute;left:76px;bottom:46px;font:700 24px 'Source Code Pro',monospace;color:#5fd0bd}
svg{position:absolute;right:50px;top:55px;width:420px;height:520px}
</style></head><body>
<div class="l"><div class="k">Obesity Companion</div><h1>Obesity, explained</h1><p>An animated, cited guide for students, people living with obesity, families and caregivers</p>

<div class="url">%HOST%/obesity</div>
<svg viewBox="0 0 420 520" aria-hidden="true">

  <circle cx="204" cy="352" r="104" fill="#d39a6a"/>
