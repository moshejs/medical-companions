<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is COPD?","acceptedAnswer":{"@type":"Answer","text":"A long-term lung condition in which damaged airways and/or air sacs make it hard to breathe out fully. It causes breathlessness, cough, phlegm and flare-ups, and the narrowing does not fully go away."}},{"@type":"Question","name":"How common is it?","acceptedAnswer":{"@type":"Answer","text":"About 1 in 10 adults aged 30–79 worldwide had COPD in 2019 (about 392 million people), most of them in low- and middle-income countries."}},{"@type":"Question","name":"Can people who never smoked get COPD?","acceptedAnswer":{"@type":"Answer","text":"Yes. Never smokers made up about a quarter of people with moderate or worse COPD in the BOLD study. Other causes include smoke from cooking fires, polluted air, dust and fumes at work, past tuberculosis and problems with lung growth in early life."}},{"@type":"Question","name":"Is COPD contagious or inherited?","acceptedAnswer":{"@type":"Answer","text":"It is not an infection that spreads. A small number of people inherit a strong risk, mainly alpha-1 antitrypsin deficiency, and smaller gene effects add up in others."}},{"@type":"Question","name":"Does stopping smoking still help once you have COPD?","acceptedAnswer":{"@type":"Answer","text":"Yes. In the Lung Health Study, people who quit regained some lung function in the first year, then lost it at about half the rate of people who kept smoking. A quit-smoking programme also lowered deaths over 14.5 years."}},{"@type":"Question","name":"How is it diagnosed?","acceptedAnswer":{"@type":"Answer","text":"With a breathing test called spirometry, done after an inhaled reliever (bronchodilator). A ratio of FEV1 to FVC below 0.7 confirms airflow obstruction."}},{"@type":"Question","name":"Can COPD be cured?","acceptedAnswer":{"@type":"Answer","text":"Lung damage that has already happened does not reverse, but several treatments, including some medicines, oxygen for low blood oxygen and quitting smoking, have been shown to lower the risk of death in selected people."}},{"@type":"Question","name":"What is the outlook?","acceptedAnswer":{"@type":"Answer","text":"It varies a lot. In a large US study, COPD shortened life expectancy only modestly in never smokers with mild-to-moderate disease, and more in smokers with severe disease. These are group averages, not predictions for one person."}}]}</script>

.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;text-align:left;white-space:nowrap}

.navbtn[aria-current="page"] .n{color:var(--brand)}

:root[data-theme="dark"] .c-dx .btn.primary,:root[data-theme="dark"] .c-rx .btn.primary,:root[data-theme="dark"] .c-rec .btn.primary,:root[data-theme="dark"] .c-fl .btn.primary{color:#11161b}
