<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "inLanguage": "he", "mainEntity": [{"@type": "Question", "name": "מהי קדחת ים תיכונית משפחתית?", "acceptedAnswer": {"@type": "Answer", "text": "קדחת ים תיכונית משפחתית היא מחלה אוטו-דלקתית תורשתית. היא גורמת להתקפים חוזרים של חום שחולפים מעצמם, עם דלקת של קרום, לרוב הצפק, ולכן התקפים מלווים בדרך כלל בכאבי בטן עזים. התקף נמשך בדרך כלל 12 עד 72 שעות ונפסק מעצמו."}}, {"@type": "Question", "name": "איזה גן גורם לקדחת ים תיכונית משפחתית?", "acceptedAnswer": {"@type": "Answer", "text": "MEFV, בזרוע הקצרה של כרומוזום 16, באזור 16p13.3. הוא מקודד לחלבון פירין, שנקרא גם מרנוסטרין. רוב הווריאנטים הקשורים למחלה נמצאים באקסון 10, המקודד את תחום B30.2, והשכיחים שבהם הם M694V, M680I, M694I ו-V726A."}}, {"@type": "Question", "name": "כמה זמן נמשך התקף FMF?", "acceptedAnswer": {"@type": "Answer", "text": "בדרך כלל 12 עד 72 שעות, ואז הוא חולף בלי אנטיביוטיקה. קריטריוני ליבנה מגדירים התקף טיפוסי כחוזר, מלווה בחום של 38 מעלות צלזיוס ומעלה, ונמשך בין 12 שעות ל-3 ימים. התקפי פרקים עשויים להימשך זמן רב יותר."}}, {"@type": "Question", "name": "למה לקולכיצין לוקח חודשים להשפיע?", "acceptedAnswer": {"@type": "Answer", "text": "קולכיצין הוא טיפול מונע יומי, לא טיפול בהתקף שכבר התחיל. הוא מצטבר בתוך תאי הדם הלבנים במשך ימים, ההתקפים ממילא היו במרווחים של שבועות ולכן הירידה במספרם נראית רק לאורך חודשים, המינון מותאם בשלבים, והתועלת הגדולה ביותר שלו, מניעת עמילואידוזיס מסוג AA, מצטברת לאורך שנים."}}, {"@type": "Question", "name": "מהו הסיבוך החמור ביותר של FMF?", "acceptedAnswer": {"@type": "Answer", "text": "עמילואידוזיס מסוג AA. רמה גבוהה ומתמשכת של עמילואיד A בסרום יוצרת סיבים ששוקעים באיברים, ובעיקר בכליה, שם הסימן הראשון הוא חלבון בשתן, וההמשך הוא תסמונת נפרוטית ואי-ספיקת כליות. נטילה סדירה של קולכיצין מונעת אותו."}}, {"@type": "Question", "name": "מי חולה בקדחת ים תיכונית משפחתית?", "acceptedAnswer": {"@type": "Answer", "text": "היא שכיחה ביותר אצל אנשים ממוצא מזרח-ים-תיכוני: יהודים ספרדים ומזרחים, ארמנים, טורקים וערבים, אף שהיא מדווחת בכל העולם. בארצות שבהן היא נפוצה השכיחות היא בערך 1 ל-500 עד 1 ל-1,000, ו-80 עד 90 אחוז מהמטופלים חווים את ההתקף הראשון לפני גיל 20."}}, {"@type": "Question", "name": "האם קדחת ים תיכונית משפחתית עוברת בתורשה?", "acceptedAnswer": {"@type": "Answer", "text": "באופן קלאסי כן, בתורשה אוטוזומלית רצסיבית, כך שבדרך כלל נדרשים שני עותקים עם וריאנט, ולכל ילד של שני נשאים יש סיכוי של אחד מארבעה. יש יוצאים מן הכלל: חלק מהווריאנטים פועלים באופן דומיננטי, ומיעוט ניכר מהמטופלים עם מחלה טיפוסית נושאים רק וריאנט אחד שניתן לזהות."}}]}</script>
