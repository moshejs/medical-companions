epsis-and-shock/sources/"],"disclaimer":"Educational synthesis of published literature. Not medical advice, and not a substitute for a clinician. Sepsis is a medical emergency: if someone with an infection becomes very unwell (confused or very drowsy, breathing very fast, cold, mottled or bluish skin, passing little or no urine), call your local emergency number or go to an emergency department now and ask: could this be sepsis? The qSOFA, SOFA, NEWS2, Phoenix and shock-index calculators are teaching tools, never for self-triage or for deciding whether to seek care. Antibiotic and vasopressor doses, fluid volumes, MAP and lactate targets and guideline statements are quoted as published, never as instructions, and mortality figures are population statistics."}</script>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is sepsis?", "acceptedAnswer": {"@type": "Answer", "text": "Sepsis is the body's harmful, out-of-control response to an infection. The infection starts it, but the body's own reaction is what injures organs such as the lungs, kidneys and brain. The 2016 Sepsis-3 definition calls it life-threatening organ dysfunction caused by a dysregulated host response to infection. It is a medical emergency."}}, {"@type": "Question", "name": "What are the symptoms of sepsis?", "acceptedAnswer": {"@type": "Answer", "text": "Warning signs include confusion or slurred speech, extreme shivering or muscle pain with fever, passing no urine all day, severe breathlessness, a feeling that something is terribly wrong, and mottled or discoloured skin. Not everyone has these signs, and someone can have sepsis without matching any list. If someone with an infection becomes very unwell (confused or very drowsy, breathing very fast, cold, mottled or bluish skin, passing little or no urine), call your local emergency number or go to an emergency department now and ask: could this be sepsis?"}}, {"@type": "Question", "name": "What causes sepsis?", "acceptedAnswer": {"@type": "Answer", "text": "Any infection can lead to sepsis, most often an infection of the chest, urine, skin or gut, and most sepsis starts at home rather than in hospital. Bacteria such as Staphylococcus aureus, Escherichia coli, Streptococcus pneumoniae, Klebsiella pneumoniae and Pseudomonas aeruginosa cause many sepsis deaths. In many people no germ is ever found."}}, {"@type": "Question", "name": "What is the difference between sepsis and septic shock?", "acceptedAnswer": {"@type": "Answer", "text": "Sepsis means an infection is causing organ dysfunction. Septic shock is a more severe part of sepsis in which blood pressure stays low despite fluids, so medicines called vasopressors are needed to hold it up, and the blood lactate level is raised. Septic shock carries a higher risk of death on average, but these are figures for large groups, not predictions for one person."}}, {"@type": "Question", "name": "How is sepsis treated?", "acceptedAnswer": {"@type": "Answer", "text": "Sepsis is treated in hospital as an emergency. Treatment usually includes antibiotics given quickly, fluids through a drip, and, if blood pressure stays low, medicines such as noradrenaline (norepinephrine) to raise it, often in intensive care. Doctors also look for and remove the source of infection, for example by draining an abscess or removing an infected line. If someone with an infection becomes very unwell (confused or very drowsy, breathing very fast, cold, mottled or bluish skin, passing little or no urine), call your local emergency number or go to an emergency department now and ask: could this be sepsis?"}}, {"@type": "Question", "name": "Can you recover from sepsis?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Many people survive sepsis, and survival has improved over time. Recovery can take months, and it is common to feel tired, weak, forgetful or low for a while; these after-effects are called post-sepsis syndrome and are not a sign of weakness. Families can be affected too, and support is available."}}, {"@type": "Question", "name": "Who is most at risk of sepsis?", "acceptedAnswer": {"@type": "Answer", "text": "Anyone can get sepsis, but it is most common in newborn babies, young children and older adults. People with long-term conditions such as lung, kidney or heart disease, diabetes or cancer, people who are frail, people taking medicines that weaken the immune system, and people without a working spleen have a higher risk. Pregnancy and the weeks after giving birth are also a time to watch closely for signs of infection."}}, {"@type": "Question", "name": "Is sepsis contagious?", "acceptedAnswer": {"@type": "Answer", "text": "Sepsis is the body's own response to an infection, so the response itself is not something you catch from another person. Some of the infections that can lead to sepsis do spread between people. Clean hands, vaccines and good care of long-term conditions help prevent the infections that lead to sepsis."}}, {"@type": "Question", "name": "What are Sepsis-3 and qSOFA?", "acceptedAnswer": {"@type": "Answer", "text": "Sepsis-3 is the 2016 international definition of sepsis: organ dysfunction caused by a dysregulated response to infection, identified by a rise of 2 points or more in the SOFA organ score. qSOFA is a three-item bedside prompt from the same work: a breathing rate of 22 a minute or more, altered thinking, and a systolic blood pressure of 100 mm Hg or less. These are tools for clinicians, not for checking yourself at home or deciding whether to seek care."}}]}</script>
