<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is the difference between dementia and Alzheimer's disease?", "acceptedAnswer": {"@type": "Answer", "text": "Dementia is a syndrome: cognitive problems severe enough to interfere with everyday tasks. Alzheimer's disease is its most common cause. The Alzheimer's Association estimates it accounts for 60 to 80 percent of dementia cases and the WHO gives 60 to 70 percent. Most people with Alzheimer's also have other brain changes, such as vascular disease, which is called mixed dementia."}}, {"@type": "Question", "name": "How many people have Alzheimer's disease?", "acceptedAnswer": {"@type": "Answer", "text": "The WHO reports 57 million people living with dementia worldwide in 2021, with nearly 10 million new cases each year. In the United States an estimated 7.2 million people aged 65 and older were living with Alzheimer's dementia in 2025, about 1 in 9 people in that age group."}}, {"@type": "Question", "name": "When do the brain changes of Alzheimer's begin?", "acceptedAnswer": {"@type": "Answer", "text": "Many years before symptoms. In families with dominantly inherited Alzheimer's, changes in amyloid in spinal fluid were detected about 25 years before expected symptom onset, amyloid on PET scans about 15 years before, and memory decline about 10 years before. Amyloid builds first, tau spreads later, and tau tracks symptoms more closely."}}, {"@type": "Question", "name": "Is there a blood test for Alzheimer's disease?", "acceptedAnswer": {"@type": "Answer", "text": "Yes, as an aid to diagnosis rather than a screening test. In May 2025 the FDA cleared the first blood test, which measures the ratio of p-tau217 to amyloid beta 42, for adults 55 and older with symptoms of cognitive decline seen in specialised care. The Alzheimer's Association's 2025 guideline says tests need at least 90 percent sensitivity and 75 percent specificity to be used for triage, and that they do not replace a full clinical evaluation."}}, {"@type": "Question", "name": "How well do lecanemab and donanemab work?", "acceptedAnswer": {"@type": "Answer", "text": "They remove amyloid plaques and slow decline modestly; they do not stop or reverse it. In the CLARITY AD trial, lecanemab slowed decline on the CDR-SB scale by 0.45 points over 18 months, a 27 percent slowing. In TRAILBLAZER-ALZ 2, donanemab slowed decline by 0.70 points over 76 weeks in the combined population. Both cause amyloid-related imaging abnormalities (ARIA), swelling or small bleeds seen on MRI, which are more common in people with two copies of APOE4. Whether the benefit is clinically meaningful is still debated."}}, {"@type": "Question", "name": "Can Alzheimer's disease be prevented?", "acceptedAnswer": {"@type": "Answer", "text": "No intervention has been shown to prevent it, but risk can be lowered. The 2024 Lancet Commission estimated that 14 modifiable risk factors account for about 45 percent of dementia cases worldwide, including hearing loss, high LDL cholesterol, less education, high blood pressure, smoking, inactivity, social isolation and untreated vision loss. That figure is a modelled upper bound that assumes the factors are causes, and most prevention trials have shown small or no effects."}}, {"@type": "Question", "name": "How long do people live after an Alzheimer's diagnosis?", "acceptedAnswer": {"@type": "Answer", "text": "It varies widely. The Alzheimer's Association reports that people aged 65 and older survive on average 4 to 8 years after diagnosis, and some live 20 years. Age at diagnosis matters: one study found median survival of 8.3 years when diagnosed at 65 and 3.4 years at 90. Pneumonia is the most commonly identified immediate cause of death."}}]}</script>

<style>
/* Alzheimer's Companion. Layout: one module on stage at a time, a rail of modules beside it.
   Sage (calm, the healthy brain) carries the interface. Amber is amyloid, rose is tau,
   sky is treatment, violet is the awareness purple used sparingly for memory. */
:root{
  --bg:#f2f4f0; --panel:#fdfefc; --panel-2:#e8ece4; --ink:#1b2420; --muted:#55615a; --line:#d5dbcf;
  --sage:#2f6b4f; --sage-soft:#dcebe2; --on-sage:#ffffff;
  --amber:#905a0c; --amber-soft:#f6e8cf;
  --rose:#ad3861; --rose-soft:#f8dfe7;
  --sky:#2b679f; --sky-soft:#dce9f6;
  --violet:#6a4ea3; --violet-soft:#ebe4f6;
  --cell:#eef3ea; --cell-line:#7d9a86; --nuc:#3f5c4b; --axon:#8aa595; --glia:#c98b5a; --vessel:#c25b5b; --csf:#d9e8f2; --field:#f8faf6;
  --good:#1d724f; --good-soft:#d8eee3; --warn:#8a5c09; --warn-soft:#f6e9cf; --bad:#b2302c; --bad-soft:#f7dad8;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1411; --panel:#151c18; --panel-2:#1d2621; --ink:#e5ece7; --muted:#9caba2; --line:#28342d;
    --sage:#6cc59a; --sage-soft:#163428; --on-sage:#0b120e;
    --amber:#e7b04a; --amber-soft:#3a2b0f;
    --rose:#f07fa6; --rose-soft:#3d1825;
    --sky:#7fb3ea; --sky-soft:#13283d;
    --violet:#b29ef0; --violet-soft:#241d3a;
    --cell:#1c2620; --cell-line:#6f8f7b; --nuc:#9fc3ad; --axon:#5d7a69; --glia:#d9a274; --vessel:#e07a7a; --csf:#16283a; --field:#121915;
    --good:#4fd1a0; --good-soft:#103a2d; --warn:#f0b54d; --warn-soft:#392a0f; --bad:#ff7a72; --bad-soft:#3c1715;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0f1411; --panel:#151c18; --panel-2:#1d2621; --ink:#e5ece7; --muted:#9caba2; --line:#28342d;
  --sage:#6cc59a; --sage-soft:#163428; --on-sage:#0b120e;
  --amber:#e7b04a; --amber-soft:#3a2b0f;
  --rose:#f07fa6; --rose-soft:#3d1825;
  --sky:#7fb3ea; --sky-soft:#13283d;
  --violet:#b29ef0; --violet-soft:#241d3a;
  --cell:#1c2620; --cell-line:#6f8f7b; --nuc:#9fc3ad; --axon:#5d7a69; --glia:#d9a274; --vessel:#e07a7a; --csf:#16283a; --field:#121915;
  --good:#4fd1a0; --good-soft:#103a2d; --warn:#f0b54d; --warn-soft:#392a0f; --bad:#ff7a72; --bad-soft:#3c1715;
  color-scheme:dark;
}
*{box-sizing:border-box}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:700;text-decoration:none;transition:top .15s}
.skip:focus{top:12px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
i,em{font-style:italic}
button{font:inherit;color:inherit}
a{color:var(--sage)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{text-wrap:balance}
sup.c{font:600 10px var(--mono);color:var(--sage);cursor:pointer;margin-left:1px;white-space:nowrap}
sup.c:hover{text-decoration:underline}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:282px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);
  padding:22px 16px 28px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;z-index:20}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand svg{width:36px;height:36px;flex:none}
.brand .sm{display:block;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:6px}
.navgroup h3{font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 2px 10px}
.navgroup ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.navbtn{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;padding:7px 10px;border-radius:9px;border:0;background:none;font-size:14.5px;cursor:pointer;line-height:1.3}
a.navbtn{color:inherit;text-decoration:none}
.navbtn .n{font:600 11px var(--mono);color:var(--muted);min-width:26px;flex:none}
.navbtn:hover{background:var(--panel-2)}
.navbtn[aria-current="page"]{background:var(--sage-soft);color:var(--sage);font-weight:700}
.navbtn[aria-current="page"] .n{color:var(--sage)}
.g-tx .navbtn[aria-current="page"]{background:var(--sky-soft);color:var(--sky)}
.g-tx .navbtn[aria-current="page"] .n{color:var(--sky)}
.g-dz .navbtn[aria-current="page"]{background:var(--rose-soft);color:var(--rose)}
.g-dz .navbtn[aria-current="page"] .n{color:var(--rose)}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);line-height:1.45;padding-left:10px;display:flex;flex-direction:column;gap:10px}
.themebtn{align-self:flex-start;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.langbtn{align-self:flex-start;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.langbtn{text-decoration:none;color:var(--ink)}
.side-foot .btnrow{display:flex;gap:8px;flex-wrap:wrap}
main{min-width:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.disclaimer{max-width:1120px;margin:0 auto 26px;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--amber-soft);font-size:13.5px;line-height:1.45}
.disclaimer b{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);white-space:nowrap;padding-top:2px}
@media (max-width:600px){.disclaimer{flex-direction:column;gap:2px;font-size:13px;margin-bottom:18px}}
.mod{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sitefoot{max-width:1120px;margin:40px auto 0;border-top:1px solid var(--line);padding-top:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sitefoot b{color:var(--ink)}
@media (min-width:901px){ main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))} }
@media (max-width:900px){
  /* the top bar keeps its own height: with an auto row it would share the 100vh with a short
     main, as on a module page before its script shows the module, then shrink (a layout shift) */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:14px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .brand{font-size:18px}
  .brand .sm{display:none}
  .brand svg{width:28px;height:28px}
  .navgroup{flex-direction:row;align-items:center}
  .navgroup h3{display:none}
  .navgroup ol{flex-direction:row;gap:4px}
  .navbtn{white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:13.5px}
  .side-foot{margin:0;padding:0;flex-direction:row}
  .brand,.side-foot{flex:none}
  .btnrow{flex-wrap:nowrap}
  .side-foot p{display:none}
}

/* ---------- type ---------- */
.eyebrow{font:600 12px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--sage);margin:0}
.c-dz .eyebrow{color:var(--rose)} .c-tx .eyebrow{color:var(--sky)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,80px);overflow-wrap:anywhere;line-height:.98;letter-spacing:-.025em;margin:0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(29px,4.2vw,46px);line-height:1.06;letter-spacing:-.02em;margin:0}
/* a module's own page makes its heading the h1 (tools/build.py); it keeps the h2 size */
h1.mh{font-size:clamp(29px,4.2vw,46px);line-height:1.06;letter-spacing:-.02em}
h3.sub{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin:8px 0 0}
.lede{font-size:18px;color:var(--muted);max-width:66ch;margin:0}
.mhead{display:flex;flex-direction:column;gap:10px}
p{margin:0}
.prose{max-width:70ch}
div.prose{display:flex;flex-direction:column;gap:10px}
p.prose{margin:0 0 14px}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.tag.sage{background:var(--sage-soft);color:var(--sage)} .tag.rose{background:var(--rose-soft);color:var(--rose)} .tag.sky{background:var(--sky-soft);color:var(--sky)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- lab layout ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.lab.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1360px){ .lab,.lab.even{grid-template-columns:minmax(0,1fr)} }
.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage svg{width:100%;height:auto;display:block}
@media (max-width:820px){ .stage svg{min-width:0!important} .scroll{overflow-x:visible} }
.stage-cap{font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.02em}
.note{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.note h4{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.12;letter-spacing:-.01em;margin:0}
.note .kicker,.kicker{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv{margin:0;display:flex;flex-direction:column;gap:10px}
.kv dt{font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
.kv dd{margin:0}
.hook{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.hook b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}
.pt{background:var(--sage-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.pt b:first-child{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sage);display:block;margin-bottom:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--sage);color:var(--on-sage);border-color:var(--sage)}
.c-dz .btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.c-tx .btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
:root[data-theme="dark"] .c-dz .btn.primary,:root[data-theme="dark"] .c-tx .btn.primary{color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dz .btn.primary,:root:not([data-theme="light"]) .c-tx .btn.primary{color:var(--bg)}}
.tl{flex:1;min-width:170px;display:flex;gap:10px;align-items:center;white-space:nowrap}
input[type=range]{accent-color:var(--sage);width:100%}
.c-dz input[type=range]{accent-color:var(--rose)} .c-tx input[type=range]{accent-color:var(--sky)}
.readout{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13px var(--mono);color:var(--muted)}
.readout b{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:10px 13px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
thead th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel-2)}
tbody th{font-weight:700}
tr.hl td,tr.hl th{background:var(--rose-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card h4{margin:0;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.18}
.card p,.card li{font-size:14.5px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:10px}
.pager button{background:none;border:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;padding:6px 0;max-width:48%}
.pager button.next{text-align:right;margin-left:auto}
.pager small{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pager span{font-family:var(--display);font-weight:800;font-size:18px}
.callout{border-left:3px solid var(--sage);padding:4px 0 4px 14px;max-width:72ch}
.c-dz .callout{border-left-color:var(--rose)} .c-tx .callout{border-left-color:var(--sky)}
.split2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){ .split2{grid-template-columns:minmax(0,1fr)} }
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.stepper button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.stepper button b{font:600 10.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.stepper button span{font-size:13px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.stepper button[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-soft)}
.c-dz .stepper button[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}
.c-tx .stepper button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.stepper button[aria-pressed="true"] b{color:var(--ink)}
.ev{display:inline-block;align-self:flex-start;justify-self:start;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;white-space:nowrap}
.ev.est{background:var(--good-soft);color:var(--good)} .ev.early{background:var(--warn-soft);color:var(--warn)} .ev.hyp{background:var(--sky-soft);color:var(--sky)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* ---------- SVG text & parts ---------- */
.t-lbl{font:700 13px var(--body);fill:var(--ink)}
.t-big{font:800 16px var(--display);fill:var(--ink)}
.t-sm{font:500 11px var(--mono);fill:var(--muted)}
.t-xs{font:500 9.5px var(--mono);fill:var(--muted)}
.t-mid{text-anchor:middle}
.t-end{text-anchor:end}
.axis{stroke:var(--line);stroke-width:1;fill:none}
.grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.arrow{stroke:var(--muted);stroke-width:1.6;fill:none}
.clk{cursor:pointer}

/* ---------- flashcards, quiz, glossary, sources ---------- */
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:240px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--sage-soft)}
.fc .front p{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,27px);line-height:1.22}
.fc .back p{font-size:17px}
.fc .face small{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15.5px;display:flex;gap:10px}
.opt .l{font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.opt:hover:not([disabled]){border-color:var(--sage)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-radius:10px;padding:12px 14px;background:var(--panel-2);font-size:15px}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);width:0;transition:width .3s}
.mn{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mn .card b.big{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.12}
.search{width:100%;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px}
.gloss b{display:block;font-size:15.5px}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.srcs li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14.5px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;scroll-margin-top:90px}
.srcs li.flash{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-soft)}
.srcs .key{font:600 11px var(--mono);color:var(--sage);letter-spacing:.04em}
.srcs .mods{display:flex;flex-wrap:wrap;gap:4px}
.srcs a,.srcs li>span{overflow-wrap:anywhere;min-width:0}
.srcs .srcnote{font-size:13px;color:var(--muted);border-left:2px solid var(--warn);padding-left:9px}
.gloss div,.card,.note,.expl,.opt{overflow-wrap:break-word}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:4px 6px}
@media (max-width:1180px){ .hero{grid-template-columns:minmax(0,1fr)} }
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.unit h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.unit ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.unit li button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 8px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;cursor:pointer}
.unit li:first-child button{border-top:0}
.unit li button:hover b{color:var(--sage)}
.unit li .n{font:600 11px var(--mono);color:var(--muted);padding-top:4px;grid-row:span 2}
.unit li b{font-size:16px}
.unit li small{color:var(--muted);font-size:14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
