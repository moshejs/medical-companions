<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "inLanguage": "he", "mainEntity": [{"@type": "Question", "name": "מה ההבדל בין דמנציה למחלת אלצהיימר?", "acceptedAnswer": {"@type": "Answer", "text": "דמנציה היא תסמונת: קשיים קוגניטיביים חמורים מספיק כדי לפגוע בתפקוד היומיומי. מחלת אלצהיימר היא הגורם השכיח ביותר לה. איגוד האלצהיימר האמריקאי מעריך שהיא אחראית ל־60 עד 80 אחוז ממקרי הדמנציה, וארגון הבריאות העולמי מעריך 60 עד 70 אחוז. אצל רוב האנשים עם אלצהיימר יש גם שינויים מוחיים אחרים, למשל מחלה של כלי הדם במוח, מצב שנקרא דמנציה מעורבת."}}, {"@type": "Question", "name": "כמה אנשים חיים עם מחלת אלצהיימר?", "acceptedAnswer": {"@type": "Answer", "text": "ארגון הבריאות העולמי מדווח על 57 מיליון אנשים שחיו עם דמנציה בעולם בשנת 2021, ועל כמעט 10 מיליון מקרים חדשים בכל שנה. בארצות הברית חיו בשנת 2025 כ־7.2 מיליון אנשים בני 65 ומעלה עם דמנציה של אלצהיימר, כאחד מכל תשעה בקבוצת הגיל הזאת."}}, {"@type": "Question", "name": "מתי מתחילים השינויים במוח במחלת אלצהיימר?", "acceptedAnswer": {"@type": "Answer", "text": "שנים רבות לפני התסמינים. במשפחות עם אלצהיימר תורשתי דומיננטי זוהו שינויים בעמילואיד בנוזל השדרה כ־25 שנה לפני מועד הופעת התסמינים הצפוי, עמילואיד בסריקות PET כ־15 שנה לפני, וירידה בזיכרון כ־10 שנים לפני. העמילואיד מצטבר ראשון, הטאו מתפשט אחריו, והטאו קשור לתסמינים באופן הדוק יותר."}}, {"@type": "Question", "name": "האם יש בדיקת דם לאלצהיימר?", "acceptedAnswer": {"@type": "Answer", "text": "כן, ככלי עזר לאבחון ולא כבדיקת סקר. במאי 2025 אישר ה־FDA את בדיקת הדם הראשונה, המודדת את היחס בין p-tau217 לעמילואיד בטא 42, למבוגרים בני 55 ומעלה עם סימנים של ירידה קוגניטיבית הנבדקים במרפאה מומחית. הנחיית איגוד האלצהיימר משנת 2025 קובעת שבדיקה צריכה רגישות של 90 אחוז לפחות וסגוליות של 75 אחוז לפחות כדי לשמש למיון ראשוני, ושהבדיקות אינן מחליפות הערכה קלינית מלאה."}}, {"@type": "Question", "name": "עד כמה יעילים לקנמאב ודונאנמאב?", "acceptedAnswer": {"@type": "Answer", "text": "הם מסלקים רובדי עמילואיד ומאטים את ההידרדרות במידה מתונה; הם אינם עוצרים אותה ואינם מחזירים אותה לאחור. בניסוי CLARITY AD האט לקנמאב את ההידרדרות בסולם CDR-SB ב־0.45 נקודות במשך 18 חודשים, האטה של 27 אחוז. בניסוי TRAILBLAZER-ALZ 2 האט דונאנמאב את ההידרדרות ב־0.70 נקודות במשך 76 שבועות באוכלוסייה המשולבת. שתי התרופות גורמות לחריגות הדמיה הקשורות לעמילואיד (ARIA), בצקת או דימומים קטנים הנראים ב־MRI, השכיחות יותר אצל נשאי שני עותקים של APOE4. השאלה אם התועלת משמעותית מבחינה קלינית עדיין שנויה במחלוקת."}}, {"@type": "Question", "name": "האם אפשר למנוע את מחלת אלצהיימר?", "acceptedAnswer": {"@type": "Answer", "text": "אף התערבות לא הוכחה כמונעת אותה, אבל אפשר להפחית את הסיכון. ועדת הלנסט העריכה בשנת 2024 ש־14 גורמי סיכון הניתנים לשינוי אחראים לכ־45 אחוז ממקרי הדמנציה בעולם, ובהם ירידה בשמיעה, כולסטרול LDL גבוה, השכלה מועטה, לחץ דם גבוה, עישון, חוסר פעילות גופנית, בידוד חברתי וירידה בראייה שאינה מטופלת. זהו גבול עליון של מודל, המניח שהגורמים הם סיבות, ורוב ניסויי המניעה הראו השפעה קטנה או לא הראו השפעה."}}, {"@type": "Question", "name": "כמה זמן חיים אחרי אבחנה של אלצהיימר?", "acceptedAnswer": {"@type": "Answer", "text": "זה משתנה מאוד. לפי איגוד האלצהיימר האמריקאי, אנשים בני 65 ומעלה חיים בממוצע 4 עד 8 שנים אחרי האבחנה, ויש שחיים 20 שנה. הגיל באבחנה משפיע: מחקר אחד מצא חציון הישרדות של 8.3 שנים כשהאבחנה בגיל 65 ו־3.4 שנים כשהיא בגיל 90. דלקת ריאות היא הסיבה המיידית השכיחה ביותר למוות שמזוהה."}}]}</script>
